<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ピコぬ市役所食堂：ネギ盛りチャレンジ</title>
<style>
  /* 絶妙な平成Webデザイン風スタイリング */
  body {
    background-color: #ffffcc;
    font-family: "MS Pゴシック", "Osaka", sans-serif;
    text-align: center;
    color: #333333;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  #game-box {
    width: 320px;
    max-width: 92vw;
    height: 380px;
    border: 3px inset #cccccc;
    background-color: #ffffff;
    margin: 10px auto;
    position: relative;
    overflow: hidden;
  }
  #negi-tower {
    font-size: 20px;
    font-weight: bold;
    color: #008000;
    line-height: 0.8;
    position: absolute;
    bottom: 50px;
    width: 100%;
    word-break: break-all;
  }
  #udon {
    font-size: 60px;
    position: absolute;
    bottom: 5px;
    width: 100%;
  }
  .btn {
    background-color: #008040;
    color: #ffffff;
    font-weight: bold;
    font-size: 22px;
    padding: 18px 36px;
    border: 3px outset #ffffff;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .btn:active {
    border: 3px inset #ffffff;
  }
  #result-msg {
    color: #ff0000;
    font-weight: bold;
    font-size: 14px;
    margin-top: 10px;
  }

  /* お邪魔キャラ:カタブツ職員 */
  #employee {
    position: absolute;
    top: 6px;
    right: -90px;
    width: 80px;
    height: 80px;
    transition: right 0.15s ease-out;
    z-index: 5;
  }
  #employee img {
    width: 100%;
    height: 100%;
    display: block;
  }
  #employee.show {
    right: 4px;
  }
  @media (max-width: 600px) {
  #game-box {
    width: 220px;
    height: 320px;
  }
  }

  #udon {
    font-size: 50px;
  }

  .btn {
    font-size: 18px;
    padding: 12px 22px;
  }
}
</style>
</head>
<body>

<h3>🌸ピコぬ市役所食堂 名物🌸<br>【ネギ盛り限界チャレンジ】</h3>
<p>「ネギ盛る」ボタンを連打して、丼の上にネギを積み上げよう！<br>（※カタブツ職員に見つかる前に盛るんだぬ！　職員が出ている間はボタンを押すな！）</p>

<div id="game-box">
  <div id="employee"><img src="../images/game/katabutsu.png" alt="カタブツ職員"></div>
  <div id="negi-tower"></div>
  <div id="udon">🍜 </div>
</div>

<button class="btn" onclick="addNegi()">ネギを盛る！</button>
<button onclick="resetGame()" style="font-size: 18px; padding: 14px 24px; margin-top: 10px; -webkit-tap-highlight-color: transparent;">やり直す</button>
<br><br>
<a href="../facilities/syokudo.html" style="font-size: 13px; color: #666666;">← 市役所食堂のページに戻る</a>

<div id="score">現在のネギ：<span id="count" style="font-size: 24px; color: green;">0</span> グラム</div>
<div id="result-msg"></div>

<script>
  let negiCount = 0;
  let isGameOver = false;
  let employeeVisible = false;
  let employeeTimer = null;

  // ---- ファミコン風ピコピコ音(Web Audio APIでその場生成) ----
  let audioCtx = null;
  function playPiko(freq, type) {
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    } catch (e) { /* 音が鳴らせない環境では何もしない */ }
  }

  function playBustSound() {
    // 下がる音を2音連続で(ガクッと崩れる感じ)
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      [440, 220].forEach((f, i) => {
        setTimeout(() => playPiko(f, 'sawtooth'), i * 120);
      });
    } catch (e) { /* noop */ }
  }

  // ---- お邪魔キャラ:カタブツ職員のランダム出現 ----
  function scheduleEmployee() {
    if (isGameOver) return;

    // 150gまでは通常ペース(1.5〜4秒間隔)。以降はネギの量が増えるほど間隔が縮まっていく
    const baseMin = 1500, baseMax = 2500;
    const over = Math.max(0, negiCount - 150);
    // 150g超過分10gごとに、間隔の上限・下限をじわじわ短縮(最短でmin400ms・max900msまで)
    const shrink = Math.min(over / 10 * 90, baseMin - 400);
    const min = baseMin - shrink;
    const max = Math.max(baseMax - shrink * 1.5, min + 400);

    const delay = min + Math.random() * (max - min);
    employeeTimer = setTimeout(showEmployee, delay);
  }

  function showEmployee() {
    if (isGameOver) return;
    employeeVisible = true;
    document.getElementById('employee').classList.add('show');
    playPiko(660, 'triangle'); // 出現音(警戒音)

    const visibleDuration = 700 + Math.random() * 500; // 見えている時間
    employeeTimer = setTimeout(() => {
      employeeVisible = false;
      document.getElementById('employee').classList.remove('show');
      scheduleEmployee(); // 次の出現をまた予約
    }, visibleDuration);
  }

  function addNegi() {
    if (isGameOver) return;

    // 職員が見ている間にボタンを押すと即アウト
    if (employeeVisible) {
      gameOver('caught');
      return;
    }

    negiCount += 10;
    document.getElementById('count').innerText = negiCount;

    // 音程はネギの量に応じて少しずつ上がる(緊張感の演出)
    const freq = 440 + Math.min(negiCount, 400) * 2;
    playPiko(freq);

    // 画面上に「ネギ」を積み上げていくテキスト演出
    let tower = document.getElementById('negi-tower');
    tower.innerHTML += "ネギ！";
  }

  function gameOver(reason) {
    isGameOver = true;
    clearTimeout(employeeTimer);
    playBustSound();

    let msg = "";
    if (negiCount >= 300) {
      msg = "【GAME OVER】<br>「…まあ、ここまで見なかったことにします」<br>カタブツ職員も少し驚いた様子で、ネギを没収されましたぬ。";
    } else {
      msg = "【GAME OVER】<br>「これだから言ったんですよ…！」<br>カタブツ職員に見つかり、ネギを没収されましたぬ……。";
    }

    document.getElementById('result-msg').innerHTML = msg;
  }

  function resetGame() {
    negiCount = 0;
    isGameOver = false;
    employeeVisible = false;
    clearTimeout(employeeTimer);
    document.getElementById('count').innerText = "0";
    document.getElementById('negi-tower').innerHTML = "";
    document.getElementById('result-msg').innerHTML = "";
    document.getElementById('employee').classList.remove('show');
    scheduleEmployee();
  }

  // 初回起動時から職員の出現スケジュールを開始
  scheduleEmployee();
</script>

        </div>

        <div class="ed-title" id="ed-title">タイトル</div>
