    <script>
        let audioCtx = null;
        function playPikoSound(freq) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.value = freq || 880;
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
            } catch (e) { /* 音が鳴らせない環境では何もしない */}
        }

        const scenario = {
            start: [
                {
                    speaker: "ピコぬ市役所 現代病相談窓口",
                    text: "ここはピコぬ市役所の「現代病相談窓口」だぬ。\n今日もAIマスコットのピコぬくんがパイプ椅子でぼんやり待機しているぬ。"
                },
                {
                    speaker: "おじさん",
                    text: "どうも。\n今日はね、塩ラーメンの話をしたいんですよ。ええ、インスタントのね。\n好きなんですよ、昔からこれがね。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "塩ラーメンのお悩みだぬ？",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "私のイチオシはね、\n野菜と卵入りなんです。ええ。\nまず、水を鍋に沸かす。\n次に玉ねぎや葉物野菜ですね。\nええ。キャベツが好きですね。私はね。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "そこに卵を落として、\n塩ラーメンの麺を入れて、\nタイマー3分です。ええ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "野菜と卵が入って、なんだか立派な一食だぬ……！",
                    chara: "piconu"
                },
                {
                    type: "choice",
                    choices: [
                        {
                            text: "奥さんの「野菜は別で食べればいい」について聞くぬ",
                            next: "yasai"
                        },
                        {
                            text: "卵を入れるタイミングについて聞くぬ",
                            next: "tamago"
                        },
                        {
                            text: "昔はこってりラーメンが好きだった話を聞くぬ",
                            next: "kotteri"
                        }
                    ]
                }
            ],

            yasai: [
                {
                    speaker: "おじさん",
                    text: "でもね、うちの妻はね、\n「ラーメンに野菜入れるくらいなら、別で食べればいいじゃない」\nって言うんですよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "別々に食べるほうがいいぬ？",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "いやいや、そういう問題じゃないんですよ。ええ。\n鍋ひとつで済むっていうのが大事なんですよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "野菜を別に茹でて、\n卵も別に調理して、\nラーメンはラーメンで作ってたらね、\n洗い物も増えますからねえ。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "人生もね、\nいちいち別々にやってたら大変ですからねえ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "人生を鍋ひとつで……。",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "まあ、妻には言ってませんけどね。\nラーメンくらいで喧嘩したくありませんから。ええ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "お疲れさまだぬ。\n帰る前に、よかったら食堂でラーメン食べるといいぬ！\nはい、食券ですぬ！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "ありがとうございます。\n食堂のラーメンは野菜、別皿ですか。\n……まあ、それもいいですねえ。",
                    chara: "ojisan"
                },
                {
                    type: "end",
                    ending: "ED_A"
                }
            ],

            tamago: [
                {
                    speaker: "おじさん",
                    text: "卵を入れるタイミングにもね、\nこだわりがあるんですよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "タイミングが大事なんだぬ？",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "妻からするとね、\n「別にいつ入れてもいいじゃない」\nなんですけどね。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "いや、違うんですよ。\n半熟というものにはね、\n半熟のタイミングがあるんですよ。ええ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "半熟にもタイミングがあるぬ……！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "私にも私のタイミングがありますから。\nねえ、そうでしょう。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "ボクには難しすぎる話だぬ……。\n卵は卵じゃないのかぬ……。",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "そこに粉末スープを入れて混ぜたら、完成ですよ。\nええ。簡単でしょう。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "お疲れさまだぬ。\n帰る前に、よかったら食堂でラーメン食べるといいぬ！\nはい、食券ですぬ！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "ありがとうございます。\n半熟卵が乗ってますねえ。\n……いいタイミングですねえ。",
                    chara: "ojisan"
                },
                {
                    type: "end",
                    ending: "ED_B"
                }
            ],

            kotteri: [
                {
                    speaker: "おじさん",
                    text: "これを作れるようになってからはね、\nわざわざもう、ラーメン屋に行かなくなりました。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "お店より家のラーメンが好きになったぬ？",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "だってそうでしょう。\n最近はラーメンも1杯1000円くらいしますしね。\n物価高ですからね。ええ。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "私もね、若いころは豚骨や背油にハマってた時もありましたよ、ええ。\nでもね、胃がね。\n野菜不足も気になりますしねえ。ええ。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "人間もね、若いうちは背油みたいなもんを求めるんですよ。\nこってりしたものをね。\n刺激が欲しいんですよ。ええ。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "最近ではドパガキっていうんですかね、ええ。\n私は知りませんけどね。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "急に知らない言葉が出てきたぬ……！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "歳を取ってくるとね、\nだんだん塩ラーメンでいいんですよ。\n野菜が入って、卵が入ってね。\nちゃんと食べたな、という感じがする。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "人生もね、そんなもんじゃないですかねえ。\n若いころは色々足したがるんですけどね。\n最後はね、必要なものがちゃんと入っていれば、それでいいんですよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "なんだか深い話になってきたぬ……！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "まあ、ラーメンの話ですけどね。ええ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "お疲れさまだぬ。\n帰る前に、よかったら食堂でラーメン食べるといいぬ！\nはい、食券ですぬ！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "ありがとうございます。\n塩ラーメンですか。\nいいですねえ。\n今日はこれくらいで丁度いいですねえ。",

        const endings = {
            ED_A: {
                badge: "ENDING A",
                title: "「タイミング」",
                desc: "その晩も、おじさんは鍋ひとつで塩ラーメンを作った。\n\nキャベツを入れ、卵を落とし、麺を入れた。\n\n3分でタイマーが鳴った。\n\nタイミングはばっちりだった。\n\nそこで会社からの電話があった。\n\n電話を切ったころには、麺はすっかりのびてしまっていた。"
            },

            ED_B: {
                badge: "ENDING B",
                title: "「半熟」",
                desc: "翌朝。\n\nおじさんは卵を茹でていた。\n\n時計を見ながら、じっと待つ。\n\n「あと10秒……」\n\n妻が横から言った。\n\n「そんなに卵ばっかり気にしてたら、遅刻するわよ。」\n\nおじさんは時計を見た。\n\nもう遅刻していた。"
            },

           ED_C: {
                badge: "ENDING C",
                title: "「必要なもの」",
                desc: "1か月後。\n\nおじさんは食堂で塩ラーメンを注文した。\n\n運ばれてきたラーメンを見て、おじさんは言った。\n\n「野菜が入って、卵が入ってね。必要なものは、ちゃんと入ってますねえ。」\n\nそう言って食べようとした。\n\n箸がなかった。"
            }
        };

        let currentScene = [];
        let sceneIndex = 0;
        let isTyping = false;
        let typeTimer = null;

        const speakerEl = document.getElementById('speaker-name');
        const textEl = document.getElementById('text-body');
        const choiceLayer = document.getElementById('choice-layer');
        const charaPiconu = document.getElementById('chara-piconu');
        const charaOjisan = document.getElementById('chara-ojisan');
        const startScreen = document.getElementById('start-screen');
        const edScreen = document.getElementById('ed-screen');

        function startGame() {
            playPikoSound(1046);
            startScreen.style.display = 'none';
            edScreen.style.display = 'none';
            loadScene('start');
        }

        function loadScene(sceneKey) {
            currentScene = scenario[sceneKey];
            sceneIndex = 0;
            showNextLine();
        }

        function showNextLine() {
            if (sceneIndex >= currentScene.length) return;

            const data = currentScene[sceneIndex];

            if (data.type === "choice") {
                showChoices(data.choices);
                return;
            }

            if (data.type === "end") {
                showEnding(data.ending);
                return;
            }

            speakerEl.textContent = data.speaker;
            updateChara(data.chara);

            const fullText = data.text;
            textEl.textContent = "";
            isTyping = true;
            let charIndex = 0;

            clearInterval(typeTimer);
            typeTimer = setInterval(() => {
                textEl.textContent += fullText[charIndex];
                charIndex++;
                if (charIndex >= fullText.length) {
                    clearInterval(typeTimer);
                    isTyping = false;
                }
            }, 32);
        }

        function advanceText() {
            if (choiceLayer.style.display === 'flex') return;

            if (isTyping) {
                clearInterval(typeTimer);
                textEl.textContent = currentScene[sceneIndex].text;
                isTyping = false;
            } else {
                sceneIndex++;
                if (sceneIndex < currentScene.length) {
                    showNextLine();
                }
            }
        }

        function updateChara(charaKey) {
            charaPiconu.classList.remove('active');
            charaOjisan.classList.remove('active');

            if (charaKey === 'piconu') charaPiconu.classList.add('active');
            if (charaKey === 'ojisan') charaOjisan.classList.add('active');
        }

        function showChoices(choices) {
            choiceLayer.innerHTML = '';
            choices.forEach(c => {
                const btn = document.createElement('div');
                btn.className = 'choice-btn';
                btn.textContent = c.text;
                btn.onclick = () => {
                    playPikoSound(880);
                    choiceLayer.style.display = 'none';
                    loadScene(c.next);
                };
                choiceLayer.appendChild(btn);
            });
            choiceLayer.style.display = 'flex';
        }

        function showEnding(edKey) {
            const ed = endings[edKey];
            document.getElementById('ed-badge').textContent = ed.badge;
            document.getElementById('ed-title').textContent = ed.title;
            document.getElementById('ed-desc').textContent = ed.desc;
            edScreen.style.display = 'flex';
        }
    </script>

</body>

</html>
