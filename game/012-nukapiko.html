    <script>
        let audioCtx = null;
        function playPikoSound(freq) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.value = freq || 880;
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
            } catch (e) { /* 音が鳴らせない環境では何もしない */}
        }

        const scenario = {
            start: [
                {
                    speaker: "ピコぬ市役所 現代病相談窓口",
                    text: "ここはピコぬ市役所の「現代病相談窓口」だぬ。\n今日もAIマスコットのピコぬくんがパイプ椅子でぼんやり待機しているぬ。"
                },
                {
                    speaker: "おじさん",
                    text: "どうも。\n今日はね、ぬかピコの話をしたいんですよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "ぬかピコのお悩みだぬ？",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "ええ。\n最近ね、ぬかピコっていうのが流行ってるらしいんですよ。\n私も息子から聞いたんですけどね。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "ぬかと、ピコですよ。\nなんですかね、あれは。\nぬか漬けとスマホの音みたいなもんだなんて言うんですけどね。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "聞いてると面白いんですよ。\n人間の頭の中に「ぬか」があって、\nそこに「ピコピコ」が入ってくると、\nなんか調子が狂うらしいんです。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "わかるようなわからないような……\n不思議な話だぬ……。",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "昔はそんなことなかったんですけどね。\nスマホもなかったしね。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "ぬかピコの説明をしてたはずなのに、\nなんか別の話になってきたぬ……？！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "でもね、思うんですよ。\nぬかってのはね、放っておくと発酵するでしょう。\n昔うちの母親もね、よくやってましたよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "あれ、ちゃんと見てないと、すぐ機嫌が変わるんですよ。\n人間も同じなんですかね。",
                    chara: "ojisan"
                },
                {
                    type: "choice",
                    choices: [
                        {
                            text: "ぬかピコって結局なんなのか聞くぬ",
                            next: "meaning"
                        },
                        {
                            text: "おじさんのパソコンの話を聞くぬ",
                            next: "computer"
                        },
                        {
                            text: "息子さんに説明してもらった話を聞くぬ",
                            next: "son"
                        }
                    ]
                }
            ],

            meaning: [
                {
                    speaker: "おじさん",
                    text: "いやあ、それがね。\n私にもよく分からないんですよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "ぬかはぬかでしょう。\nピコピコはファミコンの音ですよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "それぞれ、あんまり関係なさそうだぬ……？",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "それがねえ。関係あるんですよ。\nスマホがね、あまりにもピコピコ鳴るとこう……\n頭がなんだか、ぬかっぽくなってくるんですよね。",
                    chara: "ojisan"
                },
                 {
                    speaker: "ピコぬくん",
                    text: "例え方が独特だぬ……！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "まあ、私の頭の中はそうでもないですけどね。\n通知音、ほとんど鳴らないですから。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "じゃあ、おじさんは大丈夫ってことかぬ？",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "いやあ。\nそういうことでもないんですよねえ。\nぬかって、放っておくと発酵するでしょう。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "また、ぬかの話に戻ったぬ……。",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "人間もね、完全に止めると、それはそれで腐るっていうんですからね。\n難しいもんですよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "深いような、深くないような話だぬ……。",
                    chara: "piconu"
                },
                 {
                    speaker: "おじさん",
                    text: "あ、そろそろ晩御飯の時間なので、\n帰りますね。",
                    chara: "ojisan"
                },
                     {
                    speaker: "ピコぬくん",
                    text: "お疲れさまだぬ。\n帰る前に、よかったら食堂でうどん食べるといいぬ！\nはい、食券ですぬ！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "ありがとうございます。\nお腹が満たされたら、なにか分かればいいんですけどねえ。",
                    chara: "ojisan"
                },
                {
                    type: "end",
                    ending: "ED_A"
                }
            ],

            computer: [
                {
                    speaker: "おじさん",
                    text: "いや、これね、私のパソコンもそうでしてね。\nアップデートすると重くなるんですよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "アップデートすると重くなるぬ？",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "ええ。\nダウンデートですよね。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "おじさんのパソコンだけ、新しいシステムだぬ……！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "まあ偶然でしょうけどね。\n毎回私だけね。\nたまたま連続したというかね。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "パソコンの話なのに、妙に言い訳が多いぬ……。",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "人間も、パソコンもね、\n何かが増えると重くなるんですよ。\nそういうもんなんでしょうね。",
                    chara: "ojisan"
                },
                     {
                    speaker: "ピコぬくん",
                    text: "お疲れさまだぬ。\n帰る前に、よかったら食堂でうどん食べるといいぬ！\nはい、食券ですぬ！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "ありがとうございます。\nうどんですか？\nでも、天ぷらは重たいので止めておきますよ。",
                    chara: "ojisan"
                },
                {
                    type: "end",
                    ending: "ED_B"
                }
            ],

            son: [
                {
                    speaker: "おじさん",
                    text: "この前ね、息子に言われましてね。\n「お父さんの例え話は例えになってない」って。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "それは……かなり率直な感想だぬ。",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "そんなことないじゃないですか。\nねえ、そうでしょう。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "おじさんの私生活を見てないから、わからないぬ……。",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "そういえばこないだね、スーパーに行ったんですよ。\nそこでね、うどんを買おうと思ったんですけど、\n棚の前で5分くらい立ってたんですよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "どれも同じに見えてね。\nで、そのとき思ったんですよ。\nあ、これ、ぬかピコと一緒だなって。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "どういうことだぬ？",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "ぬかは、讃岐うどん。\nピコピコは冷水麺ですよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "急に、話についていけなくなったぬ……！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "まあ、難しい時代ですねえ。\n私もここまで15分くらい喋ってきましたけどね、\n結局、ぬかピコが何なのかは分かりませんでした。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "そろそろ明日早いので、もう帰ってぬか混ぜてから寝ます。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "お疲れさまだぬ。\n帰る前に、よかったら食堂でうどん食べるといいぬ！\nはい、食券ですぬ！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "ありがとうございます。\nうどんですか？\n讃岐うどんなら、ぬかピコしないんですけどねえ。",
                    chara: "ojisan"
                },
                {
                    type: "end",
                    ending: "ED_C"
                }
            ]
        };

        const endings = {
            ED_A: {
                badge: "ENDING A",
                title: "「ぬかピコとは何だったのか」",
                desc: "おじさんは食堂に寄った。\n\n今日もぬかピコについて明確な説明はできなかった。\n\nうどんに乗っかったネギを、じっと見ていると何かが……。\n\nひらめいた気がしたが、ただの気のせいだった。"
            },

            ED_B: {
                badge: "ENDING B",
                title: "「ダウンデート」",
                desc: "おじさんは家に帰った。\n\nパソコンの前に座り、しばらく画面を眺める。\n\n「まあ、時間ならありますからね。」\n\nそう言って、またアップデートを始めた。\n\nそして、パソコンは少しだけ重くなった。"
            },

            ED_C: {
                badge: "ENDING C",
                title: "「例えになってない」",
                desc: "その夜。\n\nおじさんはぬか床を混ぜた。\n\nスマホを見る。\n通知は来ていない。\n\n「静かなもんですよ。」\n\nそう呟いて、布団に入った。\n\n翌朝、息子からメッセージが届いていた。\n\n「昨日の話、やっぱりよく分からなかった。」"
            }
        };


        let currentScene = [];
        let sceneIndex = 0;
        let isTyping = false;
        let typeTimer = null;

        const speakerEl = document.getElementById('speaker-name');
        const textEl = document.getElementById('text-body');
        const choiceLayer = document.getElementById('choice-layer');
        const charaPiconu = document.getElementById('chara-piconu');
        const charaOjisan = document.getElementById('chara-ojisan');
        const startScreen = document.getElementById('start-screen');
        const edScreen = document.getElementById('ed-screen');

        function startGame() {
            playPikoSound(1046);
            startScreen.style.display = 'none';
            edScreen.style.display = 'none';
            loadScene('start');
        }

        function loadScene(sceneKey) {
            currentScene = scenario[sceneKey];
            sceneIndex = 0;
            showNextLine();
        }

        function showNextLine() {
            if (sceneIndex >= currentScene.length) return;

            const data = currentScene[sceneIndex];

            if (data.type === "choice") {
                showChoices(data.choices);
                return;
            }

            if (data.type === "end") {
                showEnding(data.ending);
                return;
            }

            speakerEl.textContent = data.speaker;
            updateChara(data.chara);

            const fullText = data.text;
            textEl.textContent = "";
            isTyping = true;
            let charIndex = 0;

            clearInterval(typeTimer);
            typeTimer = setInterval(() => {
                textEl.textContent += fullText[charIndex];
                charIndex++;
                if (charIndex >= fullText.length) {
                    clearInterval(typeTimer);
                    isTyping = false;
                }
            }, 32);
        }

        function advanceText() {
            if (choiceLayer.style.display === 'flex') return;

            if (isTyping) {
                clearInterval(typeTimer);
                textEl.textContent = currentScene[sceneIndex].text;
                isTyping = false;
            } else {
                sceneIndex++;
                if (sceneIndex < currentScene.length) {
                    showNextLine();
                }
            }
        }

        function updateChara(charaKey) {
            charaPiconu.classList.remove('active');
            charaOjisan.classList.remove('active');

            if (charaKey === 'piconu') charaPiconu.classList.add('active');
            if (charaKey === 'ojisan') charaOjisan.classList.add('active');
        }

        function showChoices(choices) {
            choiceLayer.innerHTML = '';
            choices.forEach(c => {
                const btn = document.createElement('div');
                btn.className = 'choice-btn';
                btn.textContent = c.text;
                btn.onclick = () => {
                    playPikoSound(880);
                    choiceLayer.style.display = 'none';
                    loadScene(c.next);
                };
                choiceLayer.appendChild(btn);
            });
            choiceLayer.style.display = 'flex';
        }

        function showEnding(edKey) {
            const ed = endings[edKey];
            document.getElementById('ed-badge').textContent = ed.badge;
            document.getElementById('ed-title').textContent = ed.title;
            document.getElementById('ed-desc').textContent = ed.desc;
            edScreen.style.display = 'flex';
        }
    </script>

</body>

</html>
