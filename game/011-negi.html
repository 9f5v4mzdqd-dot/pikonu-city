    <script>
        let audioCtx = null;
        function playPikoSound(freq) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.value = freq || 880;
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
            } catch (e) { /* 音が鳴らせない環境では何もしない */}
        }

        const scenario = {
            start: [
                {
                    speaker: "ピコぬ市役所 現代病相談窓口",
                    text: "ここはピコぬ市役所の「現代病相談窓口」だぬ。\n今日もAIマスコットのピコぬくんがパイプ椅子でぼんやり待機しているぬ。"
                },
                {
                    speaker: "おじさん",
                    text: "どうも。\n今日はね、ネギの話をしたいんですよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "ネギのお悩みだぬ？",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "ええ、ネギ。うまいですよね。\n好きなんですよネギがね、昔から。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "いきなり相談というより、ネギへの愛を語り始めたぬ……！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "私の行きつけのラーメン店ではね、\n席にネギがたくさん入った入れ物がこう……おいてあってね、\nセルフサービスなんですよ。ええ。\nうれしいですよねえ。あれはね。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "それは確かにうれしいぬ！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "でも思ったんですけどね、\nあれでよく経営やっていけますよね。\nそう思いませんか？",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "そこを心配するんだぬ……！？",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "前なんかカウンターに座った隣の客がね、\n入れ物に満タンに入ってたネギを、\nラーメンの器に全部盛り付けてるのを見たんですよ。\nええ、全部。全部ですよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "全部！？\nそれはもう、ラーメンというよりネギの山だぬ！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "え？って思いますよねえ。そうでしょう。\nでも、店員さんも何も言わず空っぽになった入れ物を取りに来るだけ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "店員さん、慣れてるぬ……。",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "ネギだけでいくらなんだと思いましたよ。ええ。\nまあ、常識の範疇でお願いしますっていうね、\nそういうことなんでしょうけども。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "急に経営コンサルタント目線みたいになったぬ……！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "まあ、常識って言ってもね、個人差があるんですよね。ええ。\n私のかかりつけのドクターなんかもよく、\n「効果には個人差があります」\nって言ってますけどね、ええ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "ネギと薬の話が同じところに着地したぬ……！",
                    chara: "piconu"
                },
                {
                    type: "choice",
                    choices: [
                        {
                            text: "おじさん自身はどれくらいネギを入れるぬ？",
                            next: "self"
                        },
                        {
                            text: "ネギを全部入れた人について聞いてみるぬ",
                            next: "customer"
                        },
                        {
                            text: "「効果には個人差があります」の意味を聞くぬ",
                            next: "doctor"
                        }
                    ]
                }
            ],

            self: [
                {
                    speaker: "おじさん",
                    text: "でも正直なこと言うとね、\n私もいちどでいいから、\nネギをあれくらい目一杯入れてみたい、と思ったりもしますよ。ええ。\nネギ好きですからね、私なんかもね。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "ボクもやってみたいぬ！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "でも人目が気になりますよね、やっぱりね。ええ。\n妻にはよく、\n「だからあなたはダメなのよ」\nなんて言われますけどね。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "それは、ネギだけの話じゃない気がうっすらするぬ……。",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "でも、私がもしね、\nネギをあれくらいてんこ盛り入れられる男だったらねえ、\n今こうはなってなかったのかもな……。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "あれ……。\nまあ、そういう話じゃないんですけどね。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "いや、たぶんそういう話だったぬ……。",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "あ、そろそろラーメン屋が開くので帰ります。\nネギ、好きなだけいれられますからね。\nありがとうございました。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "お疲れさまだぬ！\nちなみに市役所のうどんも絶品だぬ！\nはい、食券どうぞですぬ！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "あ……食堂もネギ、セルフサービスなんですね。\nまた今度行ってみます。",
                    chara: "ojisan"
                },
                {
                    type: "end",
                    ending: "ED_A"
                }
            ],

            customer: [
                {
                    speaker: "おじさん",
                    text: "いやあ、あれはすごかったですよ。\n入れ物が本当に空っぽになりましたからね。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "でもね、店員さんは何も言わないんですよ。\n怒るでもなく、注意するでもなく。\nただ、空っぽになった入れ物を持っていく。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "店員さんの対応が妙に淡々としてるぬ。",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "まあ、あれくらいは想定してるんでしょうねえ。\n常識の範疇というやつでしょうね。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "常識も、人それぞれなのかもしれないぬ。",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "ただね、私にはできないんですよ。\nあれだけ入れる勇気がない。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "ネギは好きなんですけどね。\n人目が気になっちゃうんですよ。ええ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "ネギの話だったのに、ずいぶん繊細な問題になってきたぬ……！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "ええ。\nまあ、そういうもんなんでしょうね。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "あ、そろそろ時間なので帰ります。\nありがとうございました。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "お疲れさまだぬ！\nちなみに市役所のうどんも絶品だぬ！\nはい、食券どうぞですぬ！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "あ……食堂もネギ、セルフサービスなんですね。\nまた今度行ってみます。",
                    chara: "ojisan"
                },
                {
                    type: "end",
                    ending: "ED_B"
                }
            ],

            doctor: [
                {
                    speaker: "おじさん",
                    text: "ああ、あれですか。\nまあ、薬とか飲んでもね、効く人もいれば効かない人もいるっていう話ですよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "ネギも同じなんですよ。\nたくさん入れたら幸せな人もいれば、２杯くらいで十分な人もいる。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "また、ネギと薬が同じ話になったぬ……！？",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "そういえばね、好きなだけネギを食べたくて、\nベランダでネギを育て始めたんですよ。ええ。\nこれで、好きな時に好きなだけ食べられる、と思いましてね。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "ついに自給自足に踏み出したんだぬ！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "でも実際育ててみたらね、\nラーメンに毎回てんこ盛りにしようと思ったら、\nプランター何個いるんだってことに気が付きましてね。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "場所もないですしね。\nうちワンルームですから。ええ。\n世知辛いですよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "急に現実が突き刺さってきて、胸が痛いぬ……。",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "まあ、そういうもんなんでしょうけどね。\nああ、そろそろ時間なので帰ります。\nありがとうございました。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "お疲れさまだぬ！\nちなみに市役所のうどんも絶品だぬ！\nはい、食券どうぞですぬ！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "あ……食堂もネギ、セルフサービスなんですね。\nまた今度行ってみます。",
                    chara: "ojisan"
                },
                {
                    type: "end",
                    ending: "ED_C"
                }
            ]
        };

        const endings = {
            ED_A: {
                badge: "ENDING A",
                title: "「ネギを盛れる男」",
                desc: "次の日、おじさんは食堂にいた。\n\nネギの入った容器を前にして、しばらく立ち尽くす。\n\n「……今日は、勇気を出すぞ。」\n\nそう言って、いつもより一杯だけ多くネギを入れた。"
            },

            ED_B: {
                badge: "ENDING B",
                title: "「常識の範疇」",
                desc: "食堂を出たおじさんは、店の前で少し振り返った。\n\n「まあ、あれくらいなら常識の範疇でしょうね。」\n\nおじさんは、いつもより二杯ネギを多く入れて食べたのだった。\n\n帰り道の風が、少しだけ心地よく感じた。"
            },

            ED_C: {
                badge: "ENDING C",
                title: "「ベランダのネギ」",
                desc: "数日後。\n\nベランダのプランターには、小さなネギが並んでいた。\n\n「これだけあれば……ラーメン一杯分くらいにはなるかな。」\n\nおじさんはそう言って、\n\nまた、いつものラーメン店へ向かった。"
            }
        };

        let currentScene = [];
        let sceneIndex = 0;
        let isTyping = false;
        let typeTimer = null;

        const speakerEl = document.getElementById('speaker-name');
        const textEl = document.getElementById('text-body');
        const choiceLayer = document.getElementById('choice-layer');
        const charaPiconu = document.getElementById('chara-piconu');
        const charaOjisan = document.getElementById('chara-ojisan');
        const startScreen = document.getElementById('start-screen');
        const edScreen = document.getElementById('ed-screen');

        function startGame() {
            playPikoSound(1046);
            startScreen.style.display = 'none';
            edScreen.style.display = 'none';
            loadScene('start');
        }

        function loadScene(sceneKey) {
            currentScene = scenario[sceneKey];
            sceneIndex = 0;
            showNextLine();
        }

        function showNextLine() {
            if (sceneIndex >= currentScene.length) return;

            const data = currentScene[sceneIndex];

            if (data.type === "choice") {
                showChoices(data.choices);
                return;
            }

            if (data.type === "end") {
                showEnding(data.ending);
                return;
            }

            speakerEl.textContent = data.speaker;
            updateChara(data.chara);

            const fullText = data.text;
            textEl.textContent = "";
            isTyping = true;
            let charIndex = 0;

            clearInterval(typeTimer);
            typeTimer = setInterval(() => {
                textEl.textContent += fullText[charIndex];
                charIndex++;
                if (charIndex >= fullText.length) {
                    clearInterval(typeTimer);
                    isTyping = false;
                }
            }, 32);
        }

        function advanceText() {
            if (choiceLayer.style.display === 'flex') return;

            if (isTyping) {
                clearInterval(typeTimer);
                textEl.textContent = currentScene[sceneIndex].text;
                isTyping = false;
            } else {
                sceneIndex++;
                if (sceneIndex < currentScene.length) {
                    showNextLine();
                }
            }
        }

        function updateChara(charaKey) {
            charaPiconu.classList.remove('active');
            charaOjisan.classList.remove('active');

            if (charaKey === 'piconu') charaPiconu.classList.add('active');
            if (charaKey === 'ojisan') charaOjisan.classList.add('active');
        }

        function showChoices(choices) {
            choiceLayer.innerHTML = '';
            choices.forEach(c => {
                const btn = document.createElement('div');
                btn.className = 'choice-btn';
                btn.textContent = c.text;
                btn.onclick = () => {
                    playPikoSound(880);
                    choiceLayer.style.display = 'none';
                    loadScene(c.next);
                };
                choiceLayer.appendChild(btn);
            });
            choiceLayer.style.display = 'flex';
        }

        function showEnding(edKey) {
            const ed = endings[edKey];
            document.getElementById('ed-badge').textContent = ed.badge;
            document.getElementById('ed-title').textContent = ed.title;
            document.getElementById('ed-desc').textContent = ed.desc;
            edScreen.style.display = 'flex';
        }
    </script>

</body>
