    <script>
        let audioCtx = null;
        function playPikoSound(freq) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.value = freq || 880;
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
            } catch (e) { /* 音が鳴らせない環境では何もしない */}
        }

        const scenario = {
            start: [
                {
                    speaker: "ピコぬ市役所 現代病相談窓口",
                    text: "ここはピコぬ市役所の「現代病相談窓口」だぬ。\n今日もAIマスコットのピコぬくんがパイプ椅子でぼんやり待機しているぬ。"
                },
                {
                    speaker: "おじさん",
                    text: "どうも。\n今日は蜂の巣の話をしたいんですよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "いらっしゃいだぬ！蜂の巣のお悩みだぬ？",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "私好きなんです、昔からね。\n何でできてるのかは知りませんけど、蜂の巣の形って、すごいと思いませんか？",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "あんな塊の中に、小さい穴がぽつぽつあってね。\n中に女王バチがいるみたいなんですよ。\n普段は見かけませんけどね。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "なんか、うちの妻みたいですよね。\nあれ。\nまあそういう話じゃないんですけどね。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "奥さんを蜂の巣に例える話だったぬ……！？",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "蜂の巣の中にまたね、信じられないことに蜜があるんですよ。\n花からコツコツ集めてるっていうんだから、本当にすごいですよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "なんか、私の500円玉貯金みたいですよね。\nこれがいっぱいになったら50万円っていうやつでね。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "まあ、いっぱいになったことありませんけど。\n毎回、缶切りで開けちゃったりしてね。\nははは。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "貯金箱を開ける誘惑には勝てなかったぬ……！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "こんなこといってると、息子にまた\n「お父さんの納得の仕方がわからない」\nとか言われますよ、きっと。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "息子さん、今回も鋭いぬ……！",
                    chara: "piconu"
                },
                {
                    type: "choice",
                    choices: [
                        {text: "蜂の巣の六角形について聞いてみるぬ", next: "hexagon"},
                        {text: "500円玉貯金について聞いてみるぬ", next: "savings"},
                        {text: "昔の食生活について聞いてみるぬ", next: "food"}
                    ]
                }
            ],

            hexagon: [
                {
                    speaker: "おじさん",
                    text: "あの蜂の巣の六角形もね、不思議ですよ。\n図面もコンパスもないのにね。\nきれいに作りますよね。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "測ってるわけでもなくね。\nほんと、蜂ってすごいですよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "蜂さんは、かなり几帳面だぬ……！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "そうでしょう。\n私なんかね、定規がないと何にも測れませんよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "でもご飯ならね、計りがなくてもきっちり計れますよ。\n200グラム。ええ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "急にご飯の話になったぬ……！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "値上がりやダイエットのためですけどね。\nラップして冷凍してるんです。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "昔はね、そんなことしませんでしたよ。\n大盛ですよ、大盛。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "どんぶりですよ。\n一杯じゃないですよ。何杯も食べましたからね。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "蜂の巣の六角形から、どんぶり何杯の話になったぬ……！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "まあ、若いころは食べましたからねぇ。\nあ、そろそろ議会の傍聴が始まるみたいなんで行きます。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "傍聴、間に合うといいぬ！\nちなみに市役所の食堂のうどんは絶品だぬ！\nはい、食券どうぞだぬ！",
                    chara: "piconu"
                },
                {
                    type: "end",
                    ending: "ED_A"
                }
            ],

            savings: [
                {
                    speaker: "ピコぬくん",
                    text: "500円玉貯金、今はいくらくらい貯まってるぬ？",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "それがね、全然なんですよ。\n貯まってくると気になっちゃうんですよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "最初はね、これは絶対開けないぞって思うんです。\nでもね、財布に500円玉が入ってるでしょう。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "そうすると、缶に入れたくなる。\nで、いっぱいになると今度は開けたくなるんですよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "貯金のための缶が、ただの誘惑の缶になってるぬ……！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "そうなんですよ。\nだから蜂はすごいですよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "あんなに蜜を貯めても、自分で缶を開けたりしないですからね。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "蜂はそもそも缶に入れてないぬ……！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "まあ、そういうことなんですよ。\n人間も見習わないといけませんね。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "あ、そろそろ議会の傍聴が始まるみたいなんで行きます。\nありがとうございました。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "お疲れさまだぬ！\nちなみに市役所のうどんは絶品だぬ！\n食券を渡しとくので、好きな時に行ってきてぬ！",
                    chara: "piconu"
                },
                {
                    type: "end",
                    ending: "ED_B"
                }
            ],

            food: [
                {
                    speaker: "おじさん",
                    text: "若いころは大盛食べてましたよ。\nどんぶりですよ、どんぶり。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "一杯じゃないですよ。\n何杯も食べましたからね。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "母にもね、\n「そんなにご飯ばかり食べないで、おかずも食べなさい」\nって言われたんですけどね。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "いいじゃないですか。\n好きなんですから。\n理由なんてないですよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "好きなものを食べる理由は、説明しなくてもいいと思うぬ。",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "そうでしょう。\nいいじゃないですか、好きならそれで。\nねえ、そうでしょう。",
                    chara: "ojisan"
                },
                 {
                    speaker: "ピコぬくん",
                    text: "どこかで聞いたことあるような名言だぬ……！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "今はね、200グラムにしてラップして冷凍してますけどね。\n昔ほどは食べられませんから。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "食べられる量が変わるのも、人生だぬ。",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "蜂もね、花から蜜をコツコツ集めてるでしょう。\n私もまあ、毎日コツコツやってますよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "何をコツコツやってるぬ？",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "お皿がもらえる、パン祭りのシール集めですよ。\nははは。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "ヤマ○○だぬ……！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "あ、そろそろ議会の傍聴が始まるみたいなんで行きます。\nありがとうございました。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "お疲れさまだぬ！\nちなみに市役所のうどんは絶品だぬ！\nはい、食券どうぞですぬ！",
                    chara: "piconu"
                },
                {
                    type: "end",
                    ending: "ED_C"
                }
            ]
        };

        const endings = {
            ED_A: {
                badge: "ENDING A",
                title: "「六角形と200グラム」",
                desc: "おじさんは議会の傍聴へ向かった。\n\n蜂の巣の六角形について考えていたはずが、\n気がつけば自分のご飯の量について話していた。\n\n市役所食堂のうどん食券を握りしめながら、\n「今日は大盛りにしようかな」\nと考えていた。"
            },

            ED_B: {
                badge: "ENDING B",
                title: "「500円玉の行方」",
                desc: "おじさんは食券を受け取り、議会の傍聴へ向かった。\n\n500円玉貯金は、今日も続かなかった。\n\nただし、食券だけは失くさなかった。\n\nそれだけは立派だった。"
            },

            ED_C: {
                badge: "ENDING C",
                title: "「好きならそれで」",
                desc: "おじさんは議会の傍聴へ向かった。\n\n若いころは何杯も食べたご飯。\n今は200グラムずつ冷凍している。\n\n変わったものもある。\n変わらないものもある。\n\n好きなら、それでいいのかもしれない。"
            }
        };

        let currentScene = [];
        let sceneIndex = 0;
        let isTyping = false;
        let typeTimer = null;

        const speakerEl = document.getElementById('speaker-name');
        const textEl = document.getElementById('text-body');
        const choiceLayer = document.getElementById('choice-layer');
        const charaPiconu = document.getElementById('chara-piconu');
        const charaOjisan = document.getElementById('chara-ojisan');
        const startScreen = document.getElementById('start-screen');
        const edScreen = document.getElementById('ed-screen');

        function startGame() {
            playPikoSound(1046);
            startScreen.style.display = 'none';
            edScreen.style.display = 'none';
            loadScene('start');
        }

        function loadScene(sceneKey) {
            currentScene = scenario[sceneKey];
            sceneIndex = 0;
            showNextLine();
        }

        function showNextLine() {
            if (sceneIndex >= currentScene.length) return;

            const data = currentScene[sceneIndex];

            if (data.type === "choice") {
                showChoices(data.choices);
                return;
            }

            if (data.type === "end") {
                showEnding(data.ending);
                return;
            }

            speakerEl.textContent = data.speaker;
            updateChara(data.chara);

            const fullText = data.text;
            textEl.textContent = "";
            isTyping = true;
            let charIndex = 0;

            clearInterval(typeTimer);
            typeTimer = setInterval(() => {
                textEl.textContent += fullText[charIndex];
                charIndex++;
                if (charIndex >= fullText.length) {
                    clearInterval(typeTimer);
                    isTyping = false;
                }
            }, 32);
        }

        function advanceText() {
            if (choiceLayer.style.display === 'flex') return;

            if (isTyping) {
                clearInterval(typeTimer);
                textEl.textContent = currentScene[sceneIndex].text;
                isTyping = false;
            } else {
                sceneIndex++;
                if (sceneIndex < currentScene.length) {
                    showNextLine();
                }
            }
        }

        function updateChara(charaKey) {
            charaPiconu.classList.remove('active');
            charaOjisan.classList.remove('active');

            if (charaKey === 'piconu') charaPiconu.classList.add('active');
            if (charaKey === 'ojisan') charaOjisan.classList.add('active');
        }

        function showChoices(choices) {
            choiceLayer.innerHTML = '';
            choices.forEach(c => {
                const btn = document.createElement('div');
                btn.className = 'choice-btn';
                btn.textContent = c.text;
                btn.onclick = () => {
                    playPikoSound(880);
                    choiceLayer.style.display = 'none';
                    loadScene(c.next);
                };
                choiceLayer.appendChild(btn);
            });
            choiceLayer.style.display = 'flex';
        }

        function showEnding(edKey) {
            const ed = endings[edKey];
            document.getElementById('ed-badge').textContent = ed.badge;
            document.getElementById('ed-title').textContent = ed.title;
            document.getElementById('ed-desc').textContent = ed.desc;
            edScreen.style.display = 'flex';
        }
    </script>

</body>
