    <script>
        let audioCtx = null;
        function playPikoSound(freq) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.value = freq || 880;
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
            } catch (e) { /* 音が鳴らせない環境では何もしない */}
        }

        const scenario = {
            start: [
                {
                    speaker: "ピコぬ市役所 現代病相談窓口",
                    text: "ここはピコぬ市役所の「現代病相談窓口」だぬ。\n今日もAIマスコットのピコぬくんがパイプ椅子でぼんやり待機しているぬ。"
                },
                {
                    speaker: "おじさん",
                    text: "どうも。\n今日はベンチの話をしたいんですよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "いらっしゃいだぬ！\nベンチのお悩みだぬ？",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "最近はね、駅のホームくらいでしか使いませんけど。\n\nベンチも昔より数が減りましたよね。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "休みたい場所に限ってなかったりとかね。\nあっても「長時間の休憩はご遠慮ください」なんて書いてある。\n\n何のためのベンチなんでしょうね。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "休むためのベンチなのに、休みすぎると怒られるぬ……。",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "休憩のためのベンチじゃないんでしょうか。\n\n5分や10分で回復しない人もいるんですからね。\n少なくとも一晩くらい寝ないとね。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "まあ、それだと休憩じゃなくて生活になっちゃうんですけどね。\nははは。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "一晩寝るのは……もう休憩の範囲を超えてるぬ……！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "昔はね、公園のベンチで昼寝してるおじさんとかいましたよ。\n新聞かけてね。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "あれはね、新聞読んでる途中で寝たのか、\n寝るために新聞持ってきたのか、\nそこが問題でね。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "新聞は意外と暖かいですからね。\n理にかなってるんですよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "新聞紙の保温性能について語り始めたぬ……。",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "不思議なのはね、だいたいそういうおじさんは、\nほかに荷物は持ってないんですよ。\n\n普段の生活が、全然見えてこないんです。\nねえ、不思議でしょう。",
                    chara: "ojisan"
                },
                {
                    type: "choice",
                    choices: [
                        {text: "新聞をかけて寝るおじさんについて聞いてみるぬ", next: "newspaper"},
                        {text: "おじさん自身が公園で寝た話を聞いてみるぬ", next: "park"},
                        {text: "最近のベンチについて聞いてみるぬ", next: "bench"}
                    ]
                }
            ],

            newspaper: [
                {
                    speaker: "おじさん",
                    text: "そうなんですよ。\nああいうおじさんって、どこから来てどこへ帰るのか、全然わからないでしょう。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "新聞を読んでるだけでは、生活まではわからないぬ。",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "そうでしょう。\nでもね、あれはあれで、ちゃんとした生活なんですよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "ベンチに座って、新聞を読んで、寝る。\nそれだけで一日が終わる日もあるんですよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "それはそれで、かなり完成された一日だぬ……。",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "私もね、そういう日があってもいいと思うんですよ。\n何もしない日って、必要ですからね。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "まあ、最近のベンチは長居できませんけどね。\n\nあ、そろそろ電車が来るんで。\nありがとうございました。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "お疲れさまでしたぬ！\nちなみに市役所のうどんは絶品だぬ！\n食券を渡しとくので好きな時に行ってきてぬ！",
                    chara: "piconu"
                },
                {
                    type: "end",
                    ending: "ED_A"
                }
            ],

            park: [
                {
                    speaker: "おじさん",
                    text: "私も昔やりましたよ。\n公園で寝たこと。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "公園で……！？",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "若かったですからね。\nちょっと飲みすぎて終電逃したときなんかね。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "ただね、起きたら知らないおじさんが隣で寝てました。\n怖かったですよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "それは怖いぬ……！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "でも向こうも同じ顔してました。\n\nたぶんお互い、「こいつ誰だ」って思ってましたね。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "お互いに知らない人なのに、朝を一緒に迎えたぬ……。",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "あのおじさん、今頃どうしてるんでしょうかね。\n\n仮にも一晩過ごした相手ですからね。\nははは。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "まあ、今となってはいい思い出ですよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "思い出として整理するには、なかなか情報量が多いぬ……。",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "あ、そろそろ電車が来るので乗りますね。\nありがとうございました。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "お疲れさまでしたぬ！\nちなみに市役所のうどんは絶品だぬ！\n食券を渡しとくので好きな時に行ってきてぬ！",
                    chara: "piconu"
                },
                {
                    type: "end",
                    ending: "ED_B"
                }
            ],

            bench: [
                {
                    speaker: "おじさん",
                    text: "この間、ちょっとした喧嘩で家を飛び出しましてね。\n\n試そうとしたんですよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "ベンチを……？",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "ええ。\nでもね、今のベンチは真ん中に手すりがあって横になれないんです。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "あれ、ほんとうに邪魔ですよね。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "横になる前提だったぬ……！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "だから、縦のまま寝てみようとしたんですけどね。\n\nあれって、全然寝返り打てないじゃないですか。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "縦に寝る人を想定したベンチではないと思うぬ……！",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "だから帰りました。\n\n妻に謝ってね、家に帰りましたよ。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "結局ソファで寝ましたけどね。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "ベンチよりソファのほうが、ちゃんと寝られるぬ……。",
                    chara: "piconu"
                },
                {
                    speaker: "おじさん",
                    text: "そうなんですよ。\n家って、いいもんですよね。",
                    chara: "ojisan"
                },
                {
                    speaker: "おじさん",
                    text: "あ、そろそろ電車が来たので乗りますね。\nありがとうございました。",
                    chara: "ojisan"
                },
                {
                    speaker: "ピコぬくん",
                    text: "仲直りできてよかったぬ！\nちなみに市役所のうどんは絶品だぬ！\nはい、食券どうぞですぬ！",
                    chara: "piconu"
                },
                {
                    type: "end",
                    ending: "ED_C"
                }
            ]
        };


        const endings = {
            ED_A: {
                badge: "ENDING A",
                title: "「新聞のある生活」",
                desc: "おじさんは帰りに駅の売店で新聞を買った。\n\nベンチに座って、少しだけ読んだ。\n\n眠くなったので、今日は寝なかった。\n\n新聞は意外と暖かかった。"
            },

            ED_B: {
                badge: "ENDING B",
                title: "「一晩過ごした相手」",
                desc: "電車の窓から外を眺めながら、\nおじさんは昔の公園を思い出していた。\n\nあのとき隣で寝ていたおじさんは、\n今頃どこで何をしているのだろう。\n\n名前も知らない。\n\nでも、一晩だけ一緒に寝た相手だった。"
            },

            ED_C: {
                badge: "ENDING C",
                title: "「ソファ」",
                desc: "その夜、おじさんは家に帰った。\n\n妻に謝って、ソファで寝た。\n\nベンチには手すりがある。\n\nソファにはない。\n\n「まあ、家のほうが寝やすいですからねぇ」\n\nそう言って、おじさんは眠った。"
            }
        };

        let currentScene = [];
        let sceneIndex = 0;
        let isTyping = false;
        let typeTimer = null;

        const speakerEl = document.getElementById('speaker-name');
        const textEl = document.getElementById('text-body');
        const choiceLayer = document.getElementById('choice-layer');
        const charaPiconu = document.getElementById('chara-piconu');
        const charaOjisan = document.getElementById('chara-ojisan');
        const startScreen = document.getElementById('start-screen');
        const edScreen = document.getElementById('ed-screen');

        function startGame() {
            playPikoSound(1046);
            startScreen.style.display = 'none';
            edScreen.style.display = 'none';
            loadScene('start');
        }

        function loadScene(sceneKey) {
            currentScene = scenario[sceneKey];
            sceneIndex = 0;
            showNextLine();
        }

        function showNextLine() {
            if (sceneIndex >= currentScene.length) return;

            const data = currentScene[sceneIndex];

            if (data.type === "choice") {
                showChoices(data.choices);
                return;
            }

            if (data.type === "end") {
                showEnding(data.ending);
                return;
            }

            speakerEl.textContent = data.speaker;
            updateChara(data.chara);

            const fullText = data.text;
            textEl.textContent = "";
            isTyping = true;
            let charIndex = 0;

            clearInterval(typeTimer);
            typeTimer = setInterval(() => {
                textEl.textContent += fullText[charIndex];
                charIndex++;
                if (charIndex >= fullText.length) {
                    clearInterval(typeTimer);
                    isTyping = false;
                }
            }, 32);
        }

        function advanceText() {
            if (choiceLayer.style.display === 'flex') return;

            if (isTyping) {
                clearInterval(typeTimer);
                textEl.textContent = currentScene[sceneIndex].text;
                isTyping = false;
            } else {
                sceneIndex++;
                if (sceneIndex < currentScene.length) {
                    showNextLine();
                }
            }
        }

        function updateChara(charaKey) {
            charaPiconu.classList.remove('active');
            charaOjisan.classList.remove('active');

            if (charaKey === 'piconu') charaPiconu.classList.add('active');
            if (charaKey === 'ojisan') charaOjisan.classList.add('active');
        }

        function showChoices(choices) {
            choiceLayer.innerHTML = '';
            choices.forEach(c => {
                const btn = document.createElement('div');
                btn.className = 'choice-btn';
                btn.textContent = c.text;
                btn.onclick = () => {
                    playPikoSound(880);
                    choiceLayer.style.display = 'none';
                    loadScene(c.next);
                };
                choiceLayer.appendChild(btn);
            });
            choiceLayer.style.display = 'flex';
        }

        function showEnding(edKey) {
            const ed = endings[edKey];
            document.getElementById('ed-badge').textContent = ed.badge;
            document.getElementById('ed-title').textContent = ed.title;
            document.getElementById('ed-desc').textContent = ed.desc;
            edScreen.style.display = 'flex';
        }
    </script>

</body>

</html>
