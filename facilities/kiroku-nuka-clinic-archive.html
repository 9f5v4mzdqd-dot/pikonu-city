<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>外来シリーズ 書庫 | キロクぬかクリニック | ピコぬ市公式ホームページ</title>
  <meta name="description" content="キロクぬかクリニックのオンライン診察を舞台にした短編シリーズ「外来シリーズ」の書庫です。">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .archive-filter {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .archive-filter button {
      font-size: .85rem;
      padding: .45em 1em;
      border: 1px solid var(--color-border, #d5dbe0);
      background: #fff;
      border-radius: 999px;
      cursor: pointer;
      color: var(--color-text, #2b2b2b);
    }

    .archive-filter button.active {
      background: var(--color-primary, #2b5c8a);
      border-color: var(--color-primary, #2b5c8a);
      color: #fff;
    }

    .archive-category-badge {
      display: inline-block;
      font-size: .75rem;
      padding: .15em .7em;
      border-radius: 999px;
      background: var(--color-notice-bg, #eef3f7);
      color: var(--color-text-sub, #767676);
      margin-right: .6em;
    }

    #archive-month-list a {
      display: flex;
      justify-content: space-between;
    }

    #archive-month-list a.active {
      font-weight: 700;
      color: var(--color-primary, #2b5c8a);
    }

    #archive-month-list .month-count {
      color: var(--color-text-sub, #767676);
      font-size: .85em;
    }
  </style>
</head>

<body id="top">

  <main id="main">
    <div class="page-header">
      <div class="container">
        <h1>外来シリーズ 書庫</h1>
        <p class="lead">キロクぬかクリニックの外来記録をはじめ、ピコぬ市に残された短編作品を収蔵する書庫です。</p>
      </div>
    </div>

    <div class="content-layout">
      <div class="main-content">
        <img class="facility-photo" src="../images/facilities/kiroku-nuka-clinic-archive.jpg" alt="古い書庫の書架">
        <p>
          ピコぬ市に関連する文書・読み物・創作記録を保管しています。外来記録、随筆、短編作品など、さまざまな形で残された言葉を閲覧できます。
        </p>

        <div id="archive-filter" class="archive-filter" style="display:none; margin-bottom:18px;"></div>
        <div id="archive-list">
          <p>読み込み中だぬ...</p>
        </div>
      </div>

      <aside class="sidebar">
        <div class="sidebar-block">
          <h2>関連情報</h2>
          <ul>
            <li><a href="kiroku-nuka-clinic.html">キロクぬかクリニック</a></li>
            <li><a href="shinryo-kamoku.html">診療科目一覧</a></li>
            <li><a href="../facilities/gendaibyo-db.html">現代病データベース</a></li>
            <li><a href="shinryo-kamoku.html">診療科目一覧</a></li>
            <li><a href="kiroku-nuka-clinic-director.html">医師紹介</a></li>
            <li><a href="kiroku-nuka-clinic-kenkyu.html">研究資料</a></li>
            <li><a href="../services/kiroku-nuka-monshinhyo.html">問診表</a></li>
            <li><a href="goods.html">公式グッズショップはこちら</a></li>
          </ul>
        </div>

        <div class="sidebar-block">
          <h2>月別アーカイブ</h2>
          <ul id="archive-month-list">
            <li>読み込み中...</li>
          </ul>
        </div>
      </aside>
    </div>
  </main>

  <script>window.PAGE_META = {nav: "facilities", breadcrumb: [{label: "施設案内", href: "index.html"}, {label: "キロクぬかクリニック", href: "kiroku-nuka-clinic.html"}, {label: "外来シリーズ 書庫"}]};</script>
  <script src="../js/common.js"></script>
  <script>
    (function () {
      var listEl = document.getElementById("archive-list");
      var filterEl = document.getElementById("archive-filter");
      var monthListEl = document.getElementById("archive-month-list");
      var allEntries = [];
      var activeCategory = "すべて";
      var activeMonth = null; // null = すべての月
      var CATEGORIES = ["すべて", "外来シリーズ", "○○の話", "English", "その他"];
      var NO_MONTH_KEY = "日付未設定";

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\n/g, "<br>");
      }

      function monthKeyOf(e) {
        var d = e.added_at || e.date;
        if (!d) return NO_MONTH_KEY;
        var m = String(d).match(/^(\d{4})-(\d{2})/);
        return m ? (m[1] + "年" + parseInt(m[2], 10) + "月") : NO_MONTH_KEY;
      }

      function renderFilter() {
        filterEl.style.display = "flex";
        filterEl.innerHTML = CATEGORIES.map(function (c) {
          return '<button type="button" data-category="' + escapeHtml(c) + '" class="' +
            (c === activeCategory ? "active" : "") + '">' + escapeHtml(c) + "</button>";
        }).join("");
        Array.prototype.forEach.call(filterEl.querySelectorAll("button"), function (btn) {
          btn.addEventListener("click", function () {
            activeCategory = btn.getAttribute("data-category");
            renderFilter();
            renderList();
          });
        });
      }

      function renderMonthList() {
        var counts = {};
        var order = [];
        allEntries.forEach(function (e) {
          var key = monthKeyOf(e);
          if (!(key in counts)) {counts[key] = 0; order.push(key);}
          counts[key]++;
        });
        order.sort(function (a, b) {
          if (a === NO_MONTH_KEY) return 1;
          if (b === NO_MONTH_KEY) return -1;
          return b.localeCompare(a, "ja", {numeric: true});
        });

        var html = '<li><a href="#" data-month="" class="' + (activeMonth === null ? "active" : "") + '">' +
          "すべて表示<span class=\"month-count\">" + allEntries.length + "</span></a></li>";
        html += order.map(function (key) {
          return '<li><a href="#" data-month="' + escapeHtml(key) + '" class="' +
            (activeMonth === key ? "active" : "") + '">' + escapeHtml(key) +
            '<span class="month-count">' + counts[key] + "</span></a></li>";
        }).join("");
        monthListEl.innerHTML = html;

        Array.prototype.forEach.call(monthListEl.querySelectorAll("a"), function (a) {
          a.addEventListener("click", function (ev) {
            ev.preventDefault();
            var m = a.getAttribute("data-month");
            activeMonth = m === "" ? null : m;
            renderMonthList();
            renderList();
          });
        });
      }

      function renderList() {
        var entries = allEntries.filter(function (e) {
          var cat = e.category || "外来シリーズ";
          var catOk = activeCategory === "すべて" || cat === activeCategory;
          var monthOk = activeMonth === null || monthKeyOf(e) === activeMonth;
          return catOk && monthOk;
        });
        if (entries.length === 0) {
          listEl.innerHTML = "<p>該当する作品がありません。</p>";
          return;
        }
        listEl.innerHTML = entries.map(function (e) {
          var cat = e.category || "外来シリーズ";
          var noteLink = e.note_url
            ? '<p class="diary-date"><a href="' + escapeHtml(e.note_url) + '" target="_blank" rel="noopener">note版を読む &gt;</a></p>'
            : "";
          return (
            '<div class="diary-entry">' +
            '<span class="archive-category-badge">' + escapeHtml(cat) + '</span>' +
            (e.date ? '<span class="diary-date">' + escapeHtml(e.date) + '</span>' : "") +
            '<div class="diary-title">' + escapeHtml(e.title) + '</div>' +
            '<div class="diary-body">' + escapeHtml(e.body) + '</div>' +
            noteLink +
            '</div>'
          );
        }).join("");
      }

      fetch("../data/gairai-archive.json")
        .then(function (res) {return res.json();})
        .then(function (entries) {
          if (!Array.isArray(entries) || entries.length === 0) {
            listEl.innerHTML = "<p>ただいま準備中です。近日公開予定です。</p>";
            monthListEl.innerHTML = "<li>-</li>";
            return;
          }
          entries.sort(function (a, b) {
            return (b.date || "").localeCompare(a.date || "");
          });
          allEntries = entries;
          renderFilter();
          renderMonthList();
          renderList();
        })
        .catch(function () {
          listEl.innerHTML = "<p>読み込みに失敗しました。時間をおいて試してください。</p>";
          monthListEl.innerHTML = "<li>-</li>";
        });
    })();
  </script>
</body>

</html>
