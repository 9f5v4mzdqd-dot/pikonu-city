<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>外来シリーズ 書庫 | 市立図書館 | ピコぬ市公式ホームページ</title>
  <meta name="description" content="ピコぬ市立図書館が収蔵する「外来シリーズ書庫」です。キロクぬかクリニックの外来記録をはじめ、随筆・短編作品など、ピコぬ市に関連する文書や読み物を掲載しています。">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">

  <!--
    デザインは facilities/toshokan.html を基準に統一(common.js非使用のスタンドアロン設計を踏襲)。
    下記 :root 〜 footer のスタイルは toshokan.html からそのまま移植し、
    書庫独自パーツ(.archive-*)のみ toshokan.html の配色変数で再配色しています。
  -->
  <style>
    :root {
      --paper: #FFFFFF;
      --cream: #f5f7f2;
      --onion: #a85f2e;
      --tomato: #2e8458;
      --dark: #254724;
      --line: #dabbaa;
      --muted: #687982;
      --table-head: #F3E4CB;
      --box-bg: #FBF6EC;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--dark);
      font-family: "MS Pゴシック", "Osaka", sans-serif;
      font-size: 15px;
      line-height: 1.8;
    }

    a {
      color: var(--onion);
      text-decoration: underline;
    }

    a:visited {
      color: #a83a2b;
    }

    a:hover {
      color: var(--paper);
      background: var(--tomato);
      text-decoration: none;
    }

    #main {
      min-height: 100vh;
    }

    .page-header {
      background: var(--onion);
      border-bottom: 4px solid var(--dark);
      color: var(--paper);
      padding: 24px 0 20px;
    }

    .page-header .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }

    .page-header h1 {
      margin: 0;
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 0.04em;
    }

    .page-header .lead {
      margin: 8px 0 0;
      color: var(--paper);
      font-size: 15px;
      font-weight: bold;
    }

    .header-logo {
      flex: 0 0 auto;
      width: 90px;
      height: auto;
      border: 3px solid var(--paper);
      background: var(--paper);
    }

    .breadcrumb {
      background: var(--paper);
      border-bottom: 1px dotted var(--onion);
      font-size: 13px;
    }

    .breadcrumb ol {
      max-width: 1100px;
      margin: 0 auto;
      padding: 9px 20px;
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .breadcrumb li:not(:last-child)::after {
      content: "➡";
      margin-left: 6px;
      color: var(--tomato);
    }

    .breadcrumb a {
      color: var(--dark);
    }

    .breadcrumb li:last-child {
      color: var(--dark);
      font-weight: bold;
    }

    .content-layout {
      display: flex;
      align-items: flex-start;
      gap: 22px;
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 20px;
    }

    .main-content {
      flex: 1 1 auto;
      min-width: 0;
      background: var(--paper);
      border: 2px solid var(--dark);
      padding: 24px 26px 30px;
      box-shadow: 5px 5px 0 rgba(36, 55, 70, 0.15);
    }

    .main-content p {
      margin: 0 0 12px;
    }

    .facility-photo {
      display: block;
      width: 100%;
      max-width: 620px;
      height: auto;
      margin: 0 auto 22px;
      padding: 4px;
      background: var(--paper);
      border: 1px solid var(--onion);
      box-shadow: 3px 3px 0 var(--line);
      box-sizing: border-box;
    }

    .info-box {
      margin-top: 14px;
      padding: 14px 16px;
      background: var(--box-bg);
      border: 1px solid var(--line);
      color: var(--dark);
    }

    .sidebar {
      flex: 0 0 245px;
      min-width: 0;
    }

    .sidebar-block {
      margin-bottom: 20px;
      background: var(--paper);
      border: 2px solid var(--dark);
      box-shadow: 4px 4px 0 rgba(36, 55, 70, 0.12);
    }

    .sidebar-block h2 {
      margin: 0;
      padding: 9px 12px;
      background: var(--dark);
      border-bottom: 3px solid var(--onion);
      color: var(--paper);
      font-size: 17px;
      line-height: 1.5;
    }

    .sidebar-block ul {
      list-style: none;
      margin: 0;
      padding: 10px 14px 12px;
    }

    .sidebar-block li {
      margin: 0;
      padding: 7px 0;
      border-bottom: 1px dotted var(--line);
    }

    .sidebar-block li:last-child {
      border-bottom: none;
    }

    .sidebar-block li::before {
      content: "▶ ";
      color: var(--onion);
      font-size: 12px;
    }

    footer {
      background: var(--table-head);
      border-top: 3px solid var(--onion);
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      padding: 16px 20px;
    }

    footer div {
      margin: 2px 0;
    }

    footer a {
      color: var(--onion);
    }

    @media (max-width: 760px) {
      .page-header {
        padding: 20px 0 16px;
      }

      .page-header .container {
        gap: 12px;
      }

      .page-header h1 {
        font-size: 24px;
      }

      .header-logo {
        width: 60px;
      }

      .content-layout {
        display: block;
        margin: 16px auto;
        padding: 0 12px;
      }

      .main-content {
        padding: 18px 16px 24px;
        box-shadow: 4px 4px 0 rgba(36, 55, 70, 0.12);
      }

      .sidebar {
        margin-top: 20px;
      }
    }

    /* ここから書庫独自パーツ(機能はkiroku-nuka-clinic-archive.htmlから変更なし。配色のみtoshokan.htmlのCSS変数に合わせて再配色) */
    .archive-filter {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .archive-filter button {
      font-size: .85rem;
      padding: .45em 1em;
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 999px;
      cursor: pointer;
      color: var(--dark);
      font-family: inherit;
    }

    .archive-filter button.active {
      background: var(--onion);
      border-color: var(--onion);
      color: var(--paper);
    }

    .archive-category-badge {
      display: inline-block;
      font-size: .75rem;
      padding: .15em .7em;
      border-radius: 999px;
      background: var(--table-head);
      color: var(--dark);
      margin-right: .6em;
    }

    #archive-month-list a {
      display: flex;
      justify-content: space-between;
    }

    #archive-month-list a.active {
      font-weight: 700;
      color: var(--onion);
    }

    #archive-month-list .month-count {
      color: var(--muted);
      font-size: .85em;
    }

    .archive-row {
      display: flex;
      align-items: center;
      gap: .8em;
      padding: .8em 0;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }

    .archive-row .diary-date {
      color: var(--muted);
      font-size: .85rem;
      white-space: nowrap;
    }

    .archive-row .diary-title {
      flex: 1 1 auto;
    }

    .archive-row .archive-toggle {
      font-size: .85rem;
      color: var(--onion);
      white-space: nowrap;
    }

    .archive-body-wrap {
      display: none;
      padding: 0 0 1.2em;
      border-bottom: 1px solid var(--line);
    }

    .archive-body-wrap.open {
      display: block;
    }

    .archive-row.open .archive-toggle::after {
      content: "";
    }
  </style>
</head>

<body id="top">

  <main id="main">
    <div class="page-header">
      <div class="container">
        <div>
          <h1>外来シリーズ 書庫</h1>
          <p class="lead">キロクぬかクリニックの外来記録をはじめ、随筆・短編作品など、ピコぬ市に関連する文書や読み物を収蔵しています。</p>
        </div>
        <img class="header-logo" src="../images/facilities/logo/piconu-city-logo001.jpg" alt="ピコぬ市章ロゴ">
      </div>
    </div>

    <nav class="breadcrumb" aria-label="現在位置">
      <ol>
        <li><a href="../index.html">トップ</a></li>
        <li><a href="index.html">施設案内</a></li>
        <li><a href="toshokan.html">市立図書館</a></li>
        <li>外来シリーズ 書庫</li>
      </ol>
    </nav>

    <div class="content-layout">
      <div class="main-content">
        <img class="facility-photo" src="../images/facilities/kiroku-nuka-clinic-archive.jpg" alt="古い書庫の書架">
        <p>
          ピコぬ市に関連する文書・読み物・創作記録を保管しています。外来記録、随筆、短編作品など、さまざまな形で残された言葉を閲覧できます。
        </p>

        <div class="info-box">
          <div id="archive-filter" class="archive-filter" style="display:none; margin-bottom:18px;"></div>
          <div id="archive-list">
            <p>読み込み中だぬ...</p>
          </div>
        </div>
      </div>

      <!-- 関連情報:元のクリニック系リンク多数(医師紹介・研究資料・問診表・おじさん漫談・グッズ等)を、
           toshokan.htmlの関連情報ブロックと同程度の件数まで整理しました。三笠イマ確認済み(2026-09-23)。 -->
      <aside class="sidebar">
        <div class="sidebar-block">
          <h2>関連情報</h2>
          <ul>
            <li><a href="toshokan.html">市立図書館</a></li>
            <li><a href="toshokan-zosho.html">蔵書案内</a></li>
            <li><a href="kiroku-nuka-clinic.html">キロクぬかクリニック</a></li>
          </ul>
        </div>

        <div class="sidebar-block">
          <h2>月別アーカイブ</h2>
          <ul id="archive-month-list">
            <li>読み込み中...</li>
          </ul>
        </div>
      </aside>
    </div>
  </main>

  <footer>
    <div>市立図書館</div>
    <div>Copyright © 市立図書館 All Rights Reserved.</div>
  </footer>

  <!-- 以下、JS機能はkiroku-nuka-clinic-archive.html(旧版)から完全に変更なし -->
  <script>
    (function () {
      var listEl = document.getElementById("archive-list");
      var filterEl = document.getElementById("archive-filter");
      var monthListEl = document.getElementById("archive-month-list");
      var allEntries = [];
      var activeCategory = "すべて";
      var activeMonth = null; // null = すべての月
      var CATEGORIES = ["すべて", "外来シリーズ", "○○の話", "English", "その他"];
      var NO_MONTH_KEY = "日付未設定";

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\n/g, "<br>");
      }

      function monthKeyOf(e) {
        var d = e.added_at || e.date;
        if (!d) return NO_MONTH_KEY;
        var m = String(d).match(/^(\d{4})-(\d{2})/);
        return m ? (m[1] + "年" + parseInt(m[2], 10) + "月") : NO_MONTH_KEY;
      }

      function renderFilter() {
        filterEl.style.display = "flex";
        filterEl.innerHTML = CATEGORIES.map(function (c) {
          return '<button type="button" data-category="' + escapeHtml(c) + '" class="' +
            (c === activeCategory ? "active" : "") + '">' + escapeHtml(c) + "</button>";
        }).join("");
        Array.prototype.forEach.call(filterEl.querySelectorAll("button"), function (btn) {
          btn.addEventListener("click", function () {
            activeCategory = btn.getAttribute("data-category");
            renderFilter();
            renderList();
          });
        });
      }

      function renderMonthList() {
        var counts = {};
        var order = [];
        allEntries.forEach(function (e) {
          var key = monthKeyOf(e);
          if (!(key in counts)) {counts[key] = 0; order.push(key);}
          counts[key]++;
        });
        order.sort(function (a, b) {
          if (a === NO_MONTH_KEY) return 1;
          if (b === NO_MONTH_KEY) return -1;
          return b.localeCompare(a, "ja", {numeric: true});
        });

        var html = '<li><a href="#" data-month="" class="' + (activeMonth === null ? "active" : "") + '">' +
          "すべて表示<span class=\"month-count\">" + allEntries.length + "</span></a></li>";
        html += order.map(function (key) {
          return '<li><a href="#" data-month="' + escapeHtml(key) + '" class="' +
            (activeMonth === key ? "active" : "") + '">' + escapeHtml(key) +
            '<span class="month-count">' + counts[key] + "</span></a></li>";
        }).join("");
        monthListEl.innerHTML = html;

        Array.prototype.forEach.call(monthListEl.querySelectorAll("a"), function (a) {
          a.addEventListener("click", function (ev) {
            ev.preventDefault();
            var m = a.getAttribute("data-month");
            activeMonth = m === "" ? null : m;
            renderMonthList();
            renderList();
          });
        });
      }

      function renderList() {
        var entries = allEntries.filter(function (e) {
          var cat = e.category || "外来シリーズ";
          var catOk = activeCategory === "すべて" || cat === activeCategory;
          var monthOk = activeMonth === null || monthKeyOf(e) === activeMonth;
          return catOk && monthOk;
        });
        if (entries.length === 0) {
          listEl.innerHTML = "<p>該当する作品がありません。</p>";
          return;
        }
        listEl.innerHTML = entries.map(function (e, i) {
          var cat = e.category || "外来シリーズ";
          var noteLink = e.note_url
            ? '<p class="diary-date"><a href="' + escapeHtml(e.note_url) + '" target="_blank" rel="noopener">note版を読む &gt;</a></p>'
            : "";
          return (
            '<div class="archive-row" data-index="' + i + '">' +
            '<span class="archive-category-badge">' + escapeHtml(cat) + '</span>' +
            (e.date ? '<span class="diary-date">' + escapeHtml(e.date) + '</span>' : "") +
            '<div class="diary-title">' + escapeHtml(e.title) + '</div>' +
            '<span class="archive-toggle">読む &gt;</span>' +
            '</div>' +
            '<div class="archive-body-wrap" data-index="' + i + '">' +
            '<div class="diary-body">' + escapeHtml(e.body) + '</div>' +
            noteLink +
            '</div>'
          );
        }).join("");

        Array.prototype.forEach.call(listEl.querySelectorAll(".archive-row"), function (row) {
          row.addEventListener("click", function () {
            var idx = row.getAttribute("data-index");
            var body = listEl.querySelector('.archive-body-wrap[data-index="' + idx + '"]');
            var isOpen = body.classList.contains("open");
            body.classList.toggle("open", !isOpen);
            row.classList.toggle("open", !isOpen);
            row.querySelector(".archive-toggle").textContent = isOpen ? "読む >" : "閉じる ▲";
          });
        });
      }

      fetch("../data/gairai-archive.json?t=" + Date.now())
        .then(function (res) {return res.json();})
        .then(function (entries) {
          if (!Array.isArray(entries) || entries.length === 0) {
            listEl.innerHTML = "<p>ただいま準備中です。近日公開予定です。</p>";
            monthListEl.innerHTML = "<li>-</li>";
            return;
          }
          entries.sort(function (a, b) {
            return (b.date || "").localeCompare(a.date || "");
          });
          allEntries = entries;
          renderFilter();
          renderMonthList();
          renderList();
        })
        .catch(function () {
          listEl.innerHTML = "<p>読み込みに失敗しました。時間をおいて試してください。</p>";
          monthListEl.innerHTML = "<li>-</li>";
        });
    })();
  </script>
</body>

</html>
