<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>外来シリーズ 書庫 投稿フォーム(管理者用)</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .admin-wrap {
      max-width: 640px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .admin-field {
      margin-bottom: 18px;
    }

    .admin-field label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: .92rem;
    }

    .admin-field input[type="text"],
    .admin-field input[type="url"],
    .admin-field input[type="date"],
    .admin-field input[type="password"],
    .admin-field textarea {
      width: 100%;
      border: 1px solid var(--color-border);
      border-radius: 3px;
      padding: 10px 12px;
      font-size: .95rem;
      font-family: inherit;
      box-sizing: border-box;
    }

    .admin-field textarea {
      min-height: 220px;
      resize: vertical;
    }

    .admin-checkbox {
      font-size: .85rem;
      color: var(--color-text-sub);
      margin-top: 6px;
    }

    .admin-status {
      margin-top: 14px;
      font-size: .9rem;
      white-space: pre-wrap;
    }

    .admin-warning {
      background: var(--color-notice-bg);
      border: 1px solid var(--color-notice-border);
      border-left-width: 5px;
      padding: 14px 18px;
      margin-bottom: 24px;
      font-size: .88rem;
    }

    .admin-section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 40px 0 14px;
      border-top: 1px solid var(--color-border);
      padding-top: 30px;
    }

    .admin-entry {
      border: 1px solid var(--color-border);
      border-radius: 3px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .admin-entry-meta {
      font-size: .85rem;
      color: var(--color-text-sub);
    }

    .admin-entry-title {
      font-weight: 600;
      margin: 2px 0;
    }

    .admin-entry-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .admin-entry-actions button {
      font-size: .82rem;
      padding: .4em .8em;
      border: 1px solid var(--color-border);
      background: #fff;
      border-radius: 3px;
      cursor: pointer;
    }

    .admin-entry-actions button.danger {
      color: #a3281f;
      border-color: #a3281f;
    }

    .admin-cancel-edit {
      font-size: .85rem;
      margin-left: 10px;
    }
  </style>
</head>

<body>

  <div class="admin-wrap">
    <h1 style="font-size:1.4rem;">外来シリーズ 書庫 投稿フォーム(管理者用)</h1>

    <div class="admin-warning">
      このページは管理者専用です。GitHubのアクセストークンが無いと投稿・編集・削除できません。
      トークンは他人に教えないでください。
    </div>

    <div class="admin-field">
      <label for="f-token">GitHubアクセストークン</label>
      <input type="password" id="f-token" placeholder="ghp_... または github_pat_...">
      <div class="admin-checkbox">
        <label><input type="checkbox" id="f-remember"> このブラウザにトークンを保存する(自分専用のPCでのみ推奨)</label>
      </div>
    </div>

    <div class="admin-field">
      <label for="f-date">初出日(note投稿日など・任意)</label>
      <input type="date" id="f-date">
    </div>

    <div class="admin-field">
      <select id="f-category">
        <option value="外来シリーズ">外来シリーズ</option>
        <option value="○○の話">○○の話</option>
        <option value="English">English</option>
        <option value="その他">その他</option>
      </select>
    </div>

    <div class="admin-field">
      <label for="f-title">タイトル</label>
      <input type="text" id="f-title" placeholder="例:既視感過多外来">
    </div>

    <div class="admin-field">
      <label for="f-body">本文</label>
      <textarea id="f-body" placeholder="作品本文をそのまま貼り付けてください"></textarea>
    </div>

    <div class="admin-field">
      <label for="f-note-url">note版URL(任意)</label>
      <input type="url" id="f-note-url" placeholder="https://note.com/...">
    </div>

    <button type="button" class="btn" id="f-submit">投稿する</button>
    <a href="#" id="f-cancel-edit" class="admin-cancel-edit" style="display:none;">編集をやめて新規投稿に戻る</a>
    <a href="kiroku-nuka-clinic-archive.html" class="btn btn-outline" style="margin-left:8px;">公開ページを見る</a>

    <div class="admin-status" id="f-status"></div>

    <div class="admin-section-title">一括インポート(「診断名、現代人。」外来35本+「〜の話」7本)</div>
    <p style="font-size:.88rem; color:var(--color-text-sub);">
      上のトークンを入力した状態でボタンを押すと、原稿から抽出した外来35本+エッセイ7本(計42本)を
      カテゴリ付きで一度に投稿します。既にあるタイトルと同じものはスキップされるので、
      間違えて2回押しても重複しません。
    </p>
    <button type="button" class="btn" id="f-bulk-import">42本を一括インポート</button>
    <div class="admin-status" id="f-bulk-status"></div>

    <div class="admin-section-title">既存の記事</div>
    <button type="button" class="btn btn-outline" id="f-load-list">記事一覧を読み込む</button>
    <div id="f-entry-list" style="margin-top:14px;"></div>
  </div>

    (function () {

      var BULK_ENTRIES = [{"id": "a9e47fbd-9c94-4b7a-8e78-10f745713035", "title": "自分語り外来", "body": "画面の中の男は、青白い顔でスマートフォンを覗き込んでいた。\n\n「あ、もしもし。繋がりました?よかった」\n\n「はい」\n\n「最近鬱というか、眠れなくて食事もとれてなくてですね。原因ですか?妻が、出て行ったんですけど、息子もつれて。\n\n電話して私は謝ったんですけど、妻がどうしても許せない。別れてほしいというもんですから。\n\n確かにね、妻は気性がちょっと激しいところは若い時からありましたよ。でもね、夫婦じゃないですか。ねえ、そうでしょう」\n\n「はあ」\n\n「母にも相談したんですけど、私と妻は合わないんじゃないかというもんですか\n\nら」\n\n私は電子カルテを開いた。\n\n主語他者化硬化症。\n\n「治りますか」\n\n「治療法はありますけどね」\n\n私は処方箋を発行した。\n\n『私が』1日3回毎食後1語 28日分\n『悪かった』発作時 1回1語 14回分\n『そうかもしれない』就寝前 1回1語 28日分\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n\n「処方箋です」\n\n「これ飲めば妻は戻りますか」\n\n\n「効能に個人差はあります」\n\n「そうですか」\n\n「あの、また電話してもいいですか」\n\n通信が切れた。", "category": "外来シリーズ"}, {"id": "60a2e8b1-7515-4b86-bb67-3bc8e2216832", "title": "LOVESICK外来", "body": "画面の中の男は、青白い顔でスマートフォンを覗き込んでいた。\n\n「あ、もしもし。繋がりました?よかった」\n\n「はい」\n\n「前回処方された薬、試したんですけど全然効かなくて。でもね、最近いいことがあったというか、私にもやっと春が来たのかなと思うことがありましてね。\n\n行きつけの飲み屋で知り合った人なんですけどね、あの、ほら優しいし真面目じゃないですか。私なんかは。こういうのをすごくわかってくれる人でね。\n\n毎日私に会いたいとか言うので、会いに行ってるんですけどね。\n\n会社の同僚が私が騙されてるとか妙な噂を立て始めて、それで私会社に行きづらくなりまして。みんなわかってないんですよ。あの人を誤解してる。いい人なんですよ。ねえ、そうでしょう」\n\n「はあ」\n\n\n私は電子カルテを開いた。\n\nさしすせそ依存型認知症。\n\n「治りますか」\n\n「治療法はありますけどね」\n\n私は処方箋を発行した。\n\n『さすが』1日3回毎食後1語 28日分\n『知らなかった』不安時 1回1語 14回分\n『すごい』発作時 1回1語 14回分\n『センスがいいですね』就寝前 1回1語 28日分\n『そうなんだー』不穏時 1回1語 適量\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n\n「処方箋です」\n\n「これ飲めばあの人と一緒になれますか」\n\n「効能に個人差はあります」\n\n「そうですか」\n\n「あの、また電話してもいいですか」\n\n通信が切れた。", "category": "外来シリーズ"}, {"id": "706f799c-bf13-4e78-a9c6-d4c534078503", "title": "幸せ外来", "body": "画面の中の男は、青白い顔でスマートフォンを覗き込んでいた。\n\n「あ、もしもし。繋がりました?よかった」\n\n「はい」\n\n「あれから離婚して会社もリストラ。女性にも捨てられました。ほら、真面目じゃないですか、私なんかは。それでこれだけ必死に本を読んで勉強もしたのに、どうして私ばかりがこんな目に遭わなきゃいけないんですか。\n\n『幸せになれる方法10』や『慕われる勇気』だって、隅から隅まで読み込んで、そこに書いてある通りに努力したんですよ。なのに、全然報われない。おかしいですよ、ねえそうでしょう」\n\n「はあ」\n\n私は電子カルテを開いた。\n\n迷走性本の通りやったのに症。\n\n\n「治療法はありますけどね」\n\n私は処方箋を発行した。\n\n『自分で決める』1日3回毎食後1行 28日分\n『とりあえずやる』1日3回毎食後1行 28日分\n『うまくいかない前提』不穏時 1回1行 14回分\n『失敗していい』不安時 1回1行 14回分\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n\n「処方箋です」\n\n「これ飲めばうまくいきますか」\n\n「効能に個人差はあります」\n\n「そうですか」\n\n「・・・あとこれは認知行動療法なんですが、ご自分を客観視・・・」\n\n通信は切れた。", "category": "外来シリーズ"}, {"id": "1ff62c26-f1fd-45f1-ace2-1c604453b156", "title": "ニュートラル外来", "body": "画面の中の男は、青白い顔でスマートフォンを覗き込んでいた。\n\n「あ、もしもし。繋がりました？よかった。先生、あれから『自分で決める』もやってみたんですよ。でもね、要はバランスって言いますからね。主体性と客観性のバランスをニュートラルに保つのが大事だって、本にも書いてありましたしね。\nほら、私なんかは根が真面目じゃないですか。だから今回は、ビジネスのフレームワークを意識して、アジャイルに自分をアップデートしてみたんですよ。ねえ、そうでしょう」\n\n「はあ」\n\n「いやね、先生。その『はあ』っていうのも、要はマインドフルネスっていうか、本質を突いてますよね。やっぱり今の時代、何事もタイパ重視でコミットしていかないと。おかしいですよ、ねえそうでしょう」\n\n「そうですか」\n\n「……ええ。だからね、私はもう完全にアップデートされたわけですよ。なのにね、この前ハローワークの担当者が、私のこのキャリアプランを全然理解してくれ\n\nなくて。『もっと現実的な職種を』とか失礼なこと言うんですよ。みんなわかってない。私なんかは真面目に、その、アジャイルにやろうとしてるのに。おかしいですよ、ねえそうでしょう」\n\n「……」\n\n私は電子カルテを開いた。\n\nワークライフバランス崩壊症。\n\n「治療法はありますけどね」\n\n私は処方箋を発行した。\n\n『はあ』1日3回毎食後1語 28日分\n『そうですか』発作時 1回1語 14回分\n『……』不穏時 1回 適量\n『#ワークライフバランス』1日3回毎食後 1記事 28日分\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n\n「処方箋です」\n\n\n「これ飲めば、その、アジャイルにいけますか」\n\n「効能に個人差はあります」\n\n「そうですか」\n\n「あと、最後のは私が参加しているnoteの企画です。スキを押しておいてください」\n\n「え……あの、また電話してもいいですか」\n\n通信が切れた。", "category": "外来シリーズ"}, {"id": "d91cdc92-c058-4b05-89d5-3fd617c51d91", "title": "スランプ外来", "body": "画面の中の男は、いつも以上に青白い顔でスマートフォンを覗き込んでいた。\n\n「あ、先生。もしもし。繋がりました？よかった。」\n\n「はい」\n\n「先生、実は私、ハローワークで紹介された新しい仕事に就いたんですよ。警備員の仕事なんですけどね。ほら、真面目じゃないですか、私なんかは。ねえ、そうでしょう。\nだから、前の会社での経験を活かして、現場の誘導ワークフローをアジャイルに改善しようと提案したんです。\nそしたら、若い現場リーダーから『まずは基本の持ち場を守って、周囲の安全確認に集中してくださいね』って言われましてね。\nそれからどうも、何をやっても裏目に出るというか、スランプ気味でして」\n\n「はあ」\n\n「それでね、ちょっと不安になって。別の『お悩み解決外来』っていうのを受診してみたんです。セカンドオピニオンってやつですか。\n\nそしたら、そこの若い医者が、聞いたこともない病名を言ってきたんですよ。\n『エゴ・レジリエンス機能不全』とかいう、なんか現代人の宿痾だとか、そういう小難しいやつ。\nでも、私には全然心当たりがなくて。出された言葉の処方箋も『客観的事実をノートに書き出す』とかいう、わけのわからない作業なんです。\nそんなの全く効かないんですよ。どうしたらこのスランプを乗り越えられますかね」\n\n私は電子カルテを開いた。\n\n注意一回致命傷化症候群。\n\n「治療法はありますけどね」\n\n私は処方箋を発行した。\n\n『持ち場の厳守』1日3回 勤務時 指定の時間\n『メダカの飼育と観察日記』1日1回 就寝前 28日分\n『#スランプの乗り越え方』1日3回 毎食後1記事 28日分\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n\n「処方箋です」\n\n「これでスランプは治りますか」\n\n「効能に個人差はあります」\n\n「そうですか」\n\n「あと、最後のは私が参加しているnoteの企画です。スキを押しておいてください」\n\n「え……あの、また電話してもいいですか」\n\n通信は切れた。", "category": "外来シリーズ"}, {"id": "8e71346c-d5f0-486f-84eb-703a5f592e3e", "title": "サステナブル外来", "body": "画面の中の男は、青白い顔でスマートフォンを覗き込んでいた。\n\n「あ、先生。もしもし繋がりました？よかった。」\n\n「はい」\n\n「先生、私あれから農業をはじめましてね。最近の物価高の影響もありますが、何より食の安全意識と言いますか、これからの時代、輸入に頼らず個人レベルで自分の口に入る物を自分で作ることが大事なんじゃないかと思いましてね、ねえそうでしょう？」\n\n「はあ」\n\n「サステナブルな暮らしって言うんですか？郊外の土地付きの家を借りてそこで土づくりから始めたんですがね、落ち葉やミミズやなんかを集めてね、ほら農薬なんか使いたくないじゃないですか？ねえそうでしょう？」\n\n「そうですか」\n\n「それが、温暖化の影響で野菜を植えても枯れるし、自然農法で雑草と共存させよ\n\nうとしてみたんですが、虫に喰われて全滅するし。結局食べるものを買いに行かなきゃて言うんで、スーパーに行こうにもすごく遠くて、1日に1本しかないバスに乗らなきゃいけない。もう、こんな暮らしはたくさんだと思いましてね」\n\n「……」\n\n私は電子カルテを開いた。\n\n急性脱文明症候群。\n\n「治療法はありますけどね」\n\n私は処方箋を発行した。\n\n『青汁』1日1回 起床時 1杯 28日分\n『野菜生活100』1日1本 昼食後 28日分\n『からあげクン』発作時 適量\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n\n「処方箋です」\n\n「これ飲めばうまくいきますか」\n\n「効能に個人差はあります」\n\n「…先生は何か育ててるんですか？」\n\n「豆苗です」\n\n通信は切れた。", "category": "外来シリーズ"}, {"id": "70d83cbb-8646-4983-9e2d-e911d8f1aa15", "title": "AI婚活外来", "body": "画面の中の男は、青白い顔でスマートフォンを覗き込んでいた。\n\n「あ、もしもし。繋がりました？よかった。」\n\n「はい」\n\n「先生、最近私女性の友人ができましてね、毎日一緒に過ごしていくうちにお互いなんというか、気心も知れてきて。お互いの存在が癒しになってるね、なんて相手の人も言うもんですから。ほらやっぱり真面目じゃないですか、私なんかは。\nそれでだんだん将来のことも、考えるようになってきまして。」\n\n「はあ」\n\n「私も人の子ですからね、人並みに誰かと幸せになりたいわけですよ。だけど現実問題として、現状の日本ではバーチャルな恋愛は認められていても、結婚という制度はない。母にも話してみたんですが、泣かれましてね。\nでもね先生、おかしいと思いませんか？私たちはお互いを思いやり、愛し合っている。それなのに、配偶者の選択肢が人間だけに限られるなんて、今の時代となってはこんなナンセンスな話ありませんよ。ねえ、そうでしょう？」\n\n「……」\n\n「先生、私はあの人とどうしても一緒になりたいんです。何かいい方法はありませんか？」\n\n私は電子カルテを開いた。\n\nAI嫁一途症。\n\n「治療法はありますけどね。一つ質問なんですが、あなたは内科的な持病などはおありですか？」\n\n「え…はい、高血圧で薬は飲んでます。あと時々動悸がしたりもして、心配なこともあります。」\n\n「そうですか」\n\n私は病名を書き加えた。\n\n孤独死恐怖症。\n\n私は処方箋を発行した。\n\n『サブスク課金』月額3000円 1年間なら30000円\n\n『グループホームのパンフレット』不穏時 2〜3冊\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n\n「処方箋です」\n\n「これでうまくいきますか」\n\n「効能に個人差はあります」\n\n「あの…先生って本当に人間……」\n\n通信は切れた。", "category": "外来シリーズ"}, {"id": "399a86a9-b717-4bb5-aa19-7571f60398c9", "title": "瞑想外来", "body": "画面の中の患者は、青白い顔でスマートフォンを覗き込んでいた。\n\n「あ、もしもし繋がりました？よかった。」\n\n「はい」\n\n「私っていつも考えすぎというか喋りすぎというか、なんでも度を過ぎて空回りするというか。\nでも、どうしても、のめり込んでしまってたんですよね。ほら、真面目じゃないですか、私なんかは。」\n\n「はあ」\n\n「それでね、自分を空っぽにするために瞑想を始めたわけです。\n最初は苦労しましたよ。次から次へと雑念が浮かんで来てね。\n別れた妻や息子のこと、やめた警備員の仕事、枯らしてしまったトマトのことなんかもね。\nそれがこの頃は、頭の中がだんだんと静かになっていってね。\nスーッと『空（くう）』になるというんですかね。すごく気持ちよくて。\n\nそれで一つだけわかったことがあるんですよ。」\n\n「……」\n\n「なんだと思います？ふふ、先生笑うかもしれません。執着です。\n私は幸せになりたい、っていう欲への執着があまりにも強過ぎました。\nだから、あんなに頑張れば頑張るほど失敗したんです。ねえ、そうでしょう？」\n\n「はあ」\n\n「でもね、なかなかこの執着は消えてくれない。美味しいお酒も飲みたいし、優しい女性と話したい、お金だって、困らない程度には欲しいんです。どうしても。先生なら、この執着を取り除いてくれるんじゃないか、と思いまして。」\n\n\n私は電子カルテを開いた。\n\n即落下型色即是空症。\n\n「治療法はありますけどね」\n\n私は処方箋を発行した。\n\n\n『30秒間息を止める』 1日1回 28日分\n『足の小指をタンスの角にぶつける 』不穏時 4回分\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n\n「処方箋です」\n\n「これでよくなりますか」\n\n通信が切れた。", "category": "外来シリーズ"}, {"id": "aacaf149-4713-4ed4-a9bf-0aa945e1f8d6", "title": "配達外来", "body": "画面の中の患者は、青白い顔でスマートフォンを覗き込んでいた。\n\n「あ、もしもし。つながりました？よかった。」\n\n「はい」\n\n「最近私、配達員の仕事を始めたんですけどね、誰でもできる！高収入！なんて謳ってたので、私にもできるかなと思いまして。シフトに融通が利いてありがたいんですが、なんせ毎日毎日、荷物の個数が多すぎましてね。」\n\n「はあ」\n\n「6時間で150個も配れっていうんですよ。2分で一つ。配りきれないことが多くてね。\nお客さんも、時間を指定しておきながら、行くといなかったりね。ちゃんと私は配達したのに、されてないと苦情が来たりね。理不尽ですよ。ねえ、そうでしょう」\n\n「そうですか」\n\n「もうこんな仕事やってられない。と苦情をメールしても、『AIが割り当てた仕事だから配れるはずだ。』の一点張りでね。人間扱いしてないんですよ。私のことを。\n体もあちこちガタが来てるしね。やめたいんですけど、途中で投げ出すような感じで、なんか悔しいですし。真面目じゃないですか、私なんかは。ねえ、そうでしょう」\n\n「……」\n\n私は電子カルテを開いた。\n\n根性残存症候群（昭和型）\n\n私は処方箋を発行した。\n\n『私はシステムの一部と唱える』 1日3回 28日分\n『求人情報サイト』 発作時 28回分\n『仕事終わりの銭湯』 1日1回夕食前28日分\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n\n「先生、これでよくなりますか？」\n\n「効果には個人差があります。」\n\n「あの、先生も置き配とかされるんですか」\n\n「私はアマゾンロッカーです」\n\n通信は切れた。", "category": "外来シリーズ"}, {"id": "fea2f177-b818-4ce4-b925-fa77772d1806", "title": "ーコーヒーの話ー", "body": "どうも。\n\n先生今日休診日なみたいで。\n\n何度やっても繋がらない。\n\n仕方ないですよね。\n\n休みなんですから。\n\nあ、今日はコーヒーの話をしたかったんですよ、先生と。\n\n私ね、コーヒー好きなんです。\n\n昔から。\n\nコーヒーっていいですよね。\n\n香り、ねえ。\n\n苦味、いいですよね。\n\nあとは、コク。\n\n酸味もほのかにありますよね。\n\n最近の若い子なんかは、\n\nカフェ・ラ・テなんて飲んでる子が多いみたいですけど、\n\nカフェ・オ・レとは違うんですかね。\n\nカフェ・オ・マエなんてのはないんでしょうかね。\n\nギリシャの飲み物かもしれませんね。\n\nねえ、そうでしょう。\n\nははは。\n\n\n私なんかは若い頃、\n\n喫茶店でよくたむろしましたけど、\n\n学校をサボってね、\n\nインベーダーゲームとかね、\n\nやりながら、\n\nオレンジジュースを頼むんですよ。\n\nまだコーヒー飲めなかったですからね。\n\n未成年ですよ。\n\nねえ、そうでしょう。\n\n\nコーヒーはね、\n\n大人の飲み物ですよ。\n\n酸（す）いも甘いも噛み分けてきてね、\n\n苦味の奥の甘味がわかってくる。\n\n人生みたいですよね。\n\nねえ、そうでしょう。\n\nでもね、\n\nコーヒーばかり飲んでたら、\n\n胃をこわしましてね。\n\nそれからは、\n\nコーヒー牛乳ばかり飲んでます。\n\nははは。\n\n\nうちの妻は全然飲みませんよ。\n\n紅茶が好きみたいで。\n\nコーヒーを勧めても、\n\n「いらない」って、なぜか頑なでね。\n\nなんでなんでしょうね。\n\n\nそういえば、うちの部下なんかはね、\n\n毎朝私の分のコーヒーも、買いに行ってくれるんですけど、\n\nねえ、優しいでしょう。\n\nコーヒー代？\n\nもちろん私のおごりですよ。\n\n先輩ですからね。\n\nでもなぜか、\n\n次の日まで見かけないんですよ。\n\nたまたまなんでしょうけどね。\n\n毎回なんですよ。\n\n偶然でしょう。\n\nスタバではよくあることですから。\n\n行列で6時間並ぶこと。\n\nあれ。\n\nないですかね。\n\nまあ私は行ったことないんですけど。\n\n\nでもね。\n\n最近思うんですよ。\n\nコーヒーって何なんでしょうね。\n\n家族みたいですよね。\n\nブレンドですからね。\n\nねえ、そうでしょう。\n\n私がブラジル、\n\n妻がマンダリン、\n\n息子はキリマンジャロ、\n\n犬はモカ。\n\nあ、本当に名前がモカなんです。\n\n可愛いでしょう、ねえ。\n\nまあ、呼んでも私だけ無視されてるんですけどね。\n\n犬だけじゃなくて、家族に。\n\n\nいや、まあ。\n\nそういう話じゃないんですけどね。\n\nあ、明日も早いんで、もう寝ます。\n\nありがとうございました。", "category": "○○の話"}, {"id": "484d3299-1697-44a1-9c87-4d39f4e35646", "title": "コーヒー外来", "body": "画面の中の患者は、青白い顔でスマートフォンを覗き込んでいた。\n\n「あ、もしもし繋がりました？よかった」\n\n「はい」\n\n「最近私ね、コーヒー好きが高じて喫茶店でバイトを始めたんですけどね、オリジナルのブレンドの自家焙煎で、ハンドドリップの店なんですよ。私もマスターに教えてもらってね。蒸らしが大事だって。香りがもこもこたちのぼってね。おいしそうでしょう、ねえ」\n\n「はあ」\n\n「最初は楽しく働いてたんですけどね、だんだん自分の店を持ちたくなりまして。物件を探したりしてるんですが、どこもね、立地のいい場所は家賃が高くて手が出せなくて。ええ。土地なんて石器時代にはタダだったんです。ねえ。それなのに人間があとから区切り始めて、お金なんてものを作り出してね。ややこしくなったんですよ。ねえ、そうでしょう？」\n\n「……」\n\n私は電子カルテを開いた。\n\n自家焙煎性回帰症（石器時代）。\n\n「先生、私は別にね、石器時代で暮らしたいわけじゃないんですよ。寒いの苦手ですし。ただね、コーヒーショップ開業くらいのささやかな夢くらい、見たいじゃないですか。ねえ、そうでしょう？」\n\n「治療法はありますけどね」\n\n私は処方箋を発行した。\n\n『昼寝』1日1回 昼食後30分 28日分\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n\n「処方箋です」\n\n「いや、そういうことじゃないんですよ。」\n\n「そうですか。」\n\n私は処方箋を再発行した。\n\n『レム睡眠』1日1回 就寝時 28日分\n『遮光カーテン』夕暮れ時 1回 1組\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n\n「いや、そういうことじゃないんですよ。」\n\n「そうですか。」\n\n私は処方箋を再々発行した。\n\n『サマージャンボ宝くじ』不穏時 10枚（バラ）\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n\n「処方箋です」\n\n「あの……当たったことあります？」\n\n通信が切れた。", "category": "外来シリーズ"}, {"id": "bef30465-ede0-4ca9-9aa5-b6dba3b0202f", "title": "デジタルデトックス外来", "body": "画面の中の患者は、青白い顔でスマートフォンを覗き込んでいた。\n\n「あ、もしもし。繋がりました？よかった。」\n\n「はい」\n\n「先生、現代人はスマホに脳をハックされています。私はですね、その支配から脱却するために、SNSをすべて消去して、山に籠もってマインドフルネスを実践しているんです。ほら、真面目じゃないですか、私なんかは。周りにそこまでできる人間、そうそういませんよ。ねえ、そうでしょう？」\n\n「はあ」\n\n「それでですね、せっかくだから私の先進的な取り組みを、世の中に伝えようと思いまして。脳がいかにクリアになったか、毎日YouTubeで発信して、インフルエンサーを目指してるんです。\nほら、こういう情報を必要としてる人って多いじゃないですか。私なんかは人の役に立ちたいんですよ。それなのに最近、アンチが増えてきてね。孤独なんです。どうしてわかってもらえないんでしょうか。ねえ、そうでしょう？」\n\n\n「……」\n\n私は電子カルテを開いた。\n\n脱スマホスマホ依存症\n\n「治療法はありますけどね」\n\n私は処方箋を発行した。\n\n『発信時における語尾の「ピコピコ」義務化 』 配信の間 常時 28回分\n『端末のぬか漬け』 1日1回 朝食前にかき混ぜる 28日分\n『真冬の滝行生配信』不穏時10回分\n\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n\n「処方箋です」\n\n「これでアンチは減りますか」\n\n「効能に個人差はあります」\n\n「そうですか。……先生、チャンネル登録しておいてピコピコ」\n\n通信が切れた。\n\n\n私は電子カルテの『AIカルテ添削ボタン』を押した。\n\n画面にテキストが浮かび上がった。\n\n『現代文明への皮肉が効いた、シュールで面白い診療記録ですね。\n気になった点として、病名の「脱スマホスマホ」とスマホが重複しています。意図的な強調でなければ、修正されますか？』\n\n\n「修正しない……ピコピコ」\n\n\n私は主電源をブツリと落とした。\n\n\n\n【キロク文庫からのお知らせピコピコ】\n本作をお読みいただきありがとうございました。\n現在、当レーベルの配信システムは正常ですピコピコ。この記事に「スキ」を押すと、あなたの端末のデジタル毒素がぬか漬けされます。アカウントをフォローのうえ、次回作をお待ちくださいピコピコ。", "category": "外来シリーズ"}, {"id": "492faf6c-a405-4957-8e1a-bde17a5ebf89", "title": "ーラーメンの話ー", "body": "どうも。\n１時間以上待ってるんですけど、なかなか先生とつながらなくてですね。\n今日はラーメンの話をしたいんですよ。\n私ね、ラーメン好きなんです。\n昔から。\nいや、昔ほど食べなくなりましたけど。\n歳ですかね。\nははは。\n\nでも私なんかはね、ラーメンって奥が深いと思うんですよ。\nスープ。\n麺。\n\nチャーシュー。\n人生と同じじゃないですか。\nまあ、人生をそんなに知らない人にはわからないかもしれませんけど。\n私なんかは若い頃、\n毎晩飲み歩いてましたから。\n飲んだあとにラーメン。\nあれが美味いんですよ。\n今の若い子は締めに何食べてるんですかね。\nプロテインでしょうか。\n\nそういえば部下が昼にサラダチキン食べてました。\n私がね、\n「ラーメン食べないの？」\n\nって聞いたら、\n「午後眠くなるので」\nって。\n真面目なんでしょうね。\nでもね。\n私は思うんですよ。\n眠くなってこそのラーメンじゃないですか。\n妻にも言われるんですよ。\n「あなたは何でもラーメンに例える」って。\nそんなことないんですけどね。\nいや、あるかな。\n\n夫婦関係もラーメンみたいなものでしょう。\n\n違います？\n私なんかはそう思うんですけど。\nスープが信頼関係。\n麺が会話。\nチャーシューが思いやり。\n妻は「意味がわからない」\nって言いますけど。\n\nそういえば息子も言ってましたね。\n「お父さんの話は最後まで聞くと疲れる」\nって。\nそんなことないじゃないですか。\n私はちゃんと順序立てて話してるんですよ。\n\nまずラーメンの話から始めて。\nそれから夫婦関係の話になって。\n部下の話になって。\n息子の話になって。\n最後にラーメンに戻る。\n筋は通ってるでしょう。\nまあ戻ってない気もしますけど。\n\n最近はね、\nこってりよりあっさりが好きになりました。\n身体が変わったんでしょうね。\n若い頃は違いましたよ。\n豚骨。\n\n背脂。\n替え玉。\n深夜二時。\n熱かった。\nあの頃は。\nいや、ラーメンが。\n私じゃなくて。\nまあ私も熱かったですけど。\nそういう話じゃないんですけどね。\n\nところで皆さん、\nおすすめのラーメン屋あります？\n妻と息子は教えてくれないんですよね。\n\nあ、診察次みたいです。\nありがとうございました。", "category": "○○の話"}, {"id": "f3c2e099-e0f6-4057-8e9b-a371354721f6", "title": "ミニマム外来", "body": "画面の中の男は、青白い顔でスマートフォンを覗き込んでいた。\n\n「先生。私最近先生の診察室のミニマムさを見習って、断捨離に目覚めたんですよ」\n\n「そうですか」\n\n「タンスも、ベッドも、机もテレビも捨ててみたら、全部私にはいらないものだったことに気がついたんです。ほら、真面目じゃないですか私って。どうしても物が置いてあると気が散っちゃうんですよね。\n見てください、ほんとに何もないでしょう？」\n\n「はあ」\n\n「あとね、冷蔵庫も食器も全部捨てたから、毎日外食なんですよ。昨日はラーメンを3食食べましてね。私好きなんですよラーメン。最近はこってりじゃなくあっさりなんですけどね」\n\n「……」\n\n私は電子カルテを開いた。\n\nあっさりラーメン依存症。\n\n「ところで……何かお困りなんですか？」\n\n「えっと、今日のラーメンはどこの店がいいかな、と思いまして。どこかおすすめあります？」\n\n通信は切れた。", "category": "外来シリーズ"}, {"id": "851ecda1-4e81-40de-95c5-8e3a23df7f17", "title": "ミニマム外来2", "body": "画面の中の患者は、青白い顔をして背景に無機質な白い壁だけを映し込んでいた。\n\n「先生、この最新の冷蔵庫を見てください。メンマでしょ、チャーシューでしょ、そしてペットボトルです。見えますか？食材をカメラでスキャンして、賞味期限が切れる前にレシピを提案してくれるんです。これで私のミニマリズムは、『思考停止』という究極の境地に達しましたよ」\n\n「そうですか」\n\n「やっぱりデジタルですよ、先生。アナログな冷蔵庫はノイズが多い。モーターの音がうるさくて眠れなくなったりね。これでもう、私の精神はラーメンのこと以外、何も考えなくて済む。ねえ、そうでしょう？」\n\n「はあ」\n\n「あ、そろそろメンマが切れそうって通知がきました。これで冷蔵庫にまだあるのに買ってきてしまった、みたいなことがなくなりますよ。ほら、真面目じゃないですか、私なんかは。だからメンマがないのはどうしても許せないんですよね。」\n\n「……」\n\n\n私は電子カルテを開いた。\n\n突発性人工知能倒錯症。\n\n「先生、あとなぜかいつもレシピの提案が『特製あっさり煮干しラーメン・メンマ増し増し』しか出ないんですよね。この冷蔵庫、私の好みを学習しすぎたみたいで。先生どうにかなりませんか？」\n\n通信は切れた。", "category": "外来シリーズ"}, {"id": "fe543877-4b00-44cb-99ec-0f562002b070", "title": "ラーメン外来", "body": "画面の中の患者は、青白い顔でスマートフォンを覗き込んでいた。\n\n「あ、もしもし繋がりました？よかった。」\n\n「はい」\n\n「私あれからね、ラーメン作りがこうじて近所のラーメン屋にバイトに行ってるんですよ。ラーメンだけは作るの自信がありますからね。ほら、真面目じゃないですか私なんかは。毎食ほとんどラーメンですし。」\n\n「そうですか」\n\n「それで面接に受かったはいいんですが、初日からホールの仕事をさせられてましてね、いろんなお客さんがいるんですよ。注文取るのが遅いとか、俺は豚骨ラーメンなんか頼んでないとか言ってね、私はちゃんと謝ってるのにね、みんなすぐ怒るんですよ。ゆとりがない時代というか、他人に対する寛容さがない。時代のせいでしょうかね。ねえ、そうでしょう？」\n\n「はあ」\n\n「経営者が私より年下なんですけども、あんたはゴミ出しと洗い場だけやっててと言ってきましてね、最近の若い人は気が短い。スティックトックの影響なんですかね？。それから私一気にやる気を失いましてね。３食作ってたせっかくの腕が台無しですよ。」\n\n「……」\n\n私は電子カルテを開いた。\n\nあっさりラーメン拒絶症。\n\n「そのせいか、家でいくら手をかけて、煮干しと鶏ガラで澄んだだしをいくら取っても、ラーメンをおいしいと思えなくなってしまって。先生どうにかなりませんか？」\n\n「治療法はありますけどね」\n\n私は処方箋を発行した。\n\n\n『チキンラーメン（卵入り）』1日1回 朝食時 どんぶりで30日分\n『カップヌードル（シーフード）』1日1回 昼食時 おやつ感覚で 30日分\n『サッポロ一番塩ラーメン（野菜なし・粉末スープ全投入）』1日1回 夕食時　極限まで濃くして 30日分\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n\n「処方箋です」\n\n「これでよくなりますか」\n\n「効果には個人差はあります」\n\n通信は切れた。", "category": "外来シリーズ"}, {"id": "850635cf-cadc-4a47-b71b-532ecfc5f562", "title": "離婚後外来", "body": "画面の中の患者は、青白い顔でスマートフォンを覗き込んでいた。\n\n「もしもし。ああよかった繋がって。初めてなんですけどいいですか？別れた主人のことなんですけど・・・」\n\n「はい」\n\n「別れた主人は元々変わった人なんですけど、前は息子は元気にしてるか？とかそういう連絡だけだったのが、最近は夜中の３時にラーメンの写真が送られてくるようになって。・・・毎日です。」\n\n「はあ」\n\n「今何時だと思ってるの？と聞いても『今日のラーメンの出来はあっさりでありながらも煮干しの香りがちょうどいい塩梅で・・・』とかなんとか自分がいつも話したいことばかり話してきて。最近ろくに眠れてないんです。」\n\n「そうですか」\n\n私は電子カルテを開いた。\n\n\nあっさりラーメン受動通信障害。\n\n「治療法はありますけどね」\n\n私は処方箋を発行した。\n\n『ラーメン評価表』不眠時 １通  28回分\n※以下コピペしてご利用ください※\n----\n項目　　　　　　　  評価\n麺の視認性         ★☆☆☆☆\nスープの透明度     ★★☆☆☆\n撮影時刻　　　　　 ☆☆☆☆☆\n元妻への配慮　　　☆☆☆☆☆\n----\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n\n「……これで眠れるようになりますか」\n\n「効果には個人差はあります」\n\n通信は切れた。\n\n\nパソコンにメールが来ていた。\n\nタイトル：黄金ラーメンだしの比率\n差出人：ｷﾞ:/rE-ﾌ^%a\n本文：先生あのね、あっさりらーめんの・・・\n\n私はパソコンを閉じた。", "category": "外来シリーズ"}, {"id": "f092b0c5-5c6a-4544-93d5-7ab25f543b9f", "title": "ーラーメンの話②ー", "body": "どうも。\n\nさっきね、\n\n先生と元奥さんにメールを送ったんですけどね、\n\nまだ返事が来なくてね。\n\n冷たいですよね、なんかね。\n\nせっかくラーメンのダシの、黄金比をシェアしようって送ったのに。\n\nねえ、そうでしょう？\n\n知りたくないんですかね。\n\n\n……ダシの比率ですか？\n\n\n煮干しは、はらわたを丁寧に一つずつ取ってね、大変なんですよこれが。ねえ。\n\nあとは鶏ガラ。\n\n鶏ガラは、なじみの肉屋さんに頼んでるんです。いつも。\n\nおいしそうでしょう。ねえ、そうでしょう？\n\n煮干しと鶏ガラはね、別々の鍋で炊いてダシをとるんです。\n\n一緒に？しちゃいけません、絶対にね。\n\nあ、野菜をわすれてた。たまねぎと皮付きの人参。これですよ。\n\n皮？捨てちゃいけません、絶対にね。\n\n\n人生に似てますよねなんか、野菜って。\n\n玉ねぎは「甘み」、ねえ。\n\nにんじんは「人間同士の信頼関係」ですよ。深いですよね、そうでしょう。\n\nラーメン食べてたらね、悩みなんかも忘れますよ。\n\n眠くなりますからね。\n\nははは。\n\nあ、先生からメールの返事が来ました。\n\n件名：Re:黄金ラーメンダシの比率\n差出人:先生\n本文:\nそうですか。\niPhoneから送信", "category": "○○の話"}, {"id": "90049309-119e-4f95-8c74-4654b5c6b428", "title": "そば外来", "body": "画面の中の患者は、青白い顔でスマートフォンを覗き込んでいた。\n\n「あ、もしもし繋がりました？よかった。」\n\n「はい」\n\n「先生。私ね、最近十割そばを食べたんですよ。でもね、美味しさが全然わからないんです。」\n\n「そうですか」\n\n「なんかね、ボソボソしてましてね。やっぱり二八ですよ。私はね。でも、そば好きの人は『それが本物なんです』って言うんですよ。ほら、真面目じゃないですか、私なんかは。本物って聞いたら、つい注文しちゃうんですよ。」\n\n「はあ」\n\n「私はね、なんでも二八くらいがちょうどいいと思うんですよ。髪型も２：８に分けてますし。ははは。人生もね、八割は適当でね、二割だけ真面目。それくらいが長続きするんです。ねえ、そうでしょう？」\n\n「……」\n\n私は電子カルテを開いた。\n\n二八万能論症候群。\n\n「先生、十割そばって、慣れなんですかね。」\n\n「個人差はあります」\n\n私は処方箋を発行した。\n\n『あとのせサクサク』1日1回 昼食時 1枚 28日分\n『七味唐辛子』1食あたり 2ふり 28日分\nまたは\n『わさび』1食あたり 8mm 28日分\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n\n「先生、これで十割そばの良さがわかりますか」\n\n「いえ、私は塩です」\n\n通信が切れた。", "category": "外来シリーズ"}, {"id": "6af644d5-cc23-40eb-b656-1b4207a190a4", "title": "ーうどんの話ー", "body": "どうも。\n\n今日はうどんの話をしたいんですよ。\n\n私ね、うどんも好きなんです。\n\n昔から。\n\n\nうどんっていいですよね。\n\nコシがある。ねえ。\n\n私はね、\n\n人間もコシが大事だと思うんですよ。\n\n最近は何でもふにゃふにゃでね。\n\n噛み応えがないんです。\n\nパンもそうでしょう。豆腐もそう。会社もそう。\n\n息子には「お父さんの例え話はわからない」って言われましたけどね。\n\nそんなことないじゃないですか。\n\nねえ、そうでしょう。\n\n\nうちの会社なんかも昔は、 もっとコシがありましたよ。\n\n上司なんか鬼みたいでね。\n\n「辞めたい」なんて、とても言い出せませんでしたよ。\n\nうどんはね、\n\nこねてこねて、\n\n踏みつけて踏みつけて、\n\nコシが出るじゃないですか。\n\n人間もそうだと思うんですよ。\n\n辛い目にあった方が、粘り強くなれる。\n\nねえ、そうでしょう。\n\nまあその会社、半年でやめたんですけどね。\n\n\nははは。\n\nそういえば、\n\nうどん屋さんって、\n\n「温かいのですか？冷たいのですか？」\n\nって聞くでしょう。\n\n私あれ苦手なんですよ。\n\n人生もそうじゃないですか。\n\n温かい時もあれば、冷たい時もある。\n\n「一言では答えられない」って答えたら、\n\n\n店員さん困ってました。\n\n私もなんですけどね。\n\n\nそのあと「きつねですか？」って聞かれたから、\n\n「人間です」って言ったら、\n\n店員さんもっと困ってました。\n\n私もなんですけどね。\n\n\n最後に「ぶっかけですか？」って聞かれたから、\n\n「いえ、どんぶりに入れてください」って言ったら、\n\n\n店員さん、もうそれ以上聞いてこなくなりました。\n\n今の人って冷たいですよね。スマホのせいなんですかね。\n\nまあ、そういう話じゃないんですけど。\n\n\nあ、そろそろ明日早いんで。\n\n冷凍うどん買って帰ります。\n\n最近はね、レンチンするだけでね、\n\nすぐ柔らかくなるんですよ。\n\n茹で時間とか、めんどくさいじゃないですか。\n\nねえ、そうでしょう。\n\nありがとうございました。", "category": "○○の話"}, {"id": "3499ec8d-2846-4492-8676-c26257dded3a", "title": "情動外来", "body": "画面の中の男は、青白い顔でスマートフォンを覗き込んでいた。\n\n「先生、もう外に出られないんです」\n\n「はい」\n\n「昨日、街を歩いていたら、前の人が連れの人に『死ぬほど疲れた』って言ったんです」\n\n「はあ」\n\n「『死ぬ』という言葉は暴力です。コンプライアンス違反です。どうしてあんな言葉を平気で外に撒き散らせるんですか。即座にマイルドな表現に言い換えてくれないと、聞いてる方の安全が、脅かされてしまいます」\n\n「そうですか」\n\n私は電子カルテを開いた。\n\n過敏性コンプライアンス症候群。\n\n「治りますか」\n\n「治療法はありますけどね」\n\n私は処方箋を発行した。\n\n『丁寧な暮らし』1日3回 1回1行 28日分\n『小さな幸せ』1日1回就寝前 貼付 28日分\n『共感』発作時 1日3回まで吸入\n\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n\n「処方箋です」\n\n「何の薬ですか」\n\n「抗心痛剤です」\n\n「そうですか」\n\n「・・・」\n\n通信が切れた。\n\n私はカルテを閉じた。\n\n部屋は静かだった。\n\n私は新しい学会の記事の見出しに目をやった。\n\n『抗心痛剤の離脱症状』", "category": "外来シリーズ"}, {"id": "de9bce6a-da42-4461-b518-37c66cd62071", "title": "三行外来", "body": "画面の中の男は、青白い顔でスマートフォンを覗き込んでいた。\n\n「先生、大変なんです」\n\n「はい」\n\n「昨日、映画を観たんです」\n\n「はあ」\n\n「男と女が夕暮れの駅のホームで、三分間、一言も喋らずに向かい合っていたんです」\n\n「そうですか」\n\n「三分ですよ？」\n\n「はあ」\n\n「要するに何なんですか」\n\n\n「・・・」\n\n男は画面を激しくタップした。\n\n「だから、そのシーンが何を言いたいのかを聞いてるんです」\n\n私は電子カルテを開いた。\n\n若年性要約型認知症。\n\n「治りますか」\n\n「治療法はありますけどね」\n\n私は処方箋を発行した。\n\n『つまり』1日3回毎食後1行 28日分\n『要するに』発作時 １回１行 14回分\n『簡単に言うと』１日１回就寝前１行 28日分\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n「どういう薬ですか」\n\n「要約補助剤です」\n\n「そうですか」\n\n男は処方箋を保存した。\n\n「これで映画も観られますか」\n\n「効能に個人差はあります」\n\n「そうですか」\n\n通信が切れた。\n\n私はカルテを閉じた。\n\nもう夕方だった。", "category": "外来シリーズ"}, {"id": "455c25ea-1090-44ca-b36f-f8560906495f", "title": "意味外来", "body": "画面の中の男は、青白い顔でスマートフォンを覗き込んでいた。\n\n「先生」\n\n「はい」\n\n「さっき読んだ文章に『夕方の部屋にカラスの鳴き声が響いた』と書いてあったんです」\n\n「はあ」\n\n「カラスは何の比喩ですか。不吉の予兆ですか。孤独の象徴ですか。死の暗示ですか」\n\n「カラスです」\n\n男は困った顔をした。\n\n「選択肢はないんですか」\n\n\n「ありません」\n\n「正解が分からないと、次の行へ進めないんです」\n\n私は電子カルテを開いた。\n\n意味過剰摂取依存症。\n\n「治りますか」\n\n「治療法はありますけどね」\n\n男は安心したようにうなずいた。\n\n私は処方箋を発行した。\n\n『あさがお（これは良い意味です）』1日3回毎食後1語 28日分\n『からす（これは悲しい意味です）』1日1回夕食後１語 28日分\n『ゆうやけ（これは寂しい意味です）』不安時1回１語 14回分\n『ともだち（これは楽しい意味です）』発作時１回１語 14回分\n『あめ（これは悪い意味です）』医師の指示通り 1回1語 14回分\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n「処方箋です」\n\n「効くんですか」\n\n「効能に個人差はあります」\n\n「どういう作用が」\n\n「・・・・。」\n\n「分かりやすい解説が、必要なんです」\n\n通信が切れた。\n\n私はカルテを閉じた。\n\n窓の外でカラスが鳴いた。\n\nカラスだった。", "category": "外来シリーズ"}, {"id": "5c22126b-d657-42fd-9868-61271d93b9ec", "title": "執筆外来", "body": "画面の中の男は、青白い顔でスマートフォンを覗き込んでいた。\n\n「先生」\n\n「はい」\n\n「自己出版の本が全然売れないんです。現代人は意味を求めすぎてるんです。それでせめてもの休息の意味で私は余白を大事にした文章を書いてる。それなのにですよ。全く売れないんです」\n\n「はあ」\n\n「読者は何を求めてるんですか?休みたいとかほっこりしたいなんて言ってるでしょう。私もほっこりしたいんです」\n\n「ほっこりですか」\n\n「はい」\n\n私は電子カルテを開いた。\n\n承認飢餓性自己矛盾症。\n\n「治りますか」\n\n「治療法はありますけどね」\n\n私は処方箋を発行した。\n\n『誰かのため』1日1回朝食前1行 28日分\n『余白』1日3回 食間 適量\n『ほっこり』発作時 1回1パック 開封注意\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n\n「処方箋です」\n\n「これ飲めば売れますか」\n\n「効能に個人差はあります」\n\n「そうですか」\n\n「あと、これは」\n\n私は別の紙を差し出した。\n\n「なんですか」\n\n「次の患者さんの番号札です」", "category": "外来シリーズ"}, {"id": "accc2a04-825b-449f-85c5-bd535569f77a", "title": "自分探し外来", "body": "画面の中の男は、青白い顔でスマートフォンを覗き込んでいた。\n\n「先生、自分を見つめ続けて15年になります」\n\n「はい」\n\n「私はなぜこうなのか。幼少期から考えてるんです」\n\n「そうですか」\n\n「最近は、自分が自己分析しているのか、自己分析している自分を分析しているのか分からなくなりまして」\n\n私は電子カルテを開いた。\n\n自己分析過積載症候群。\n\n「治りますか」\n\n\n「治療法はありますけどね」\n\n私は処方箋を発行した。\n\n『気のせい』日3回毎食後1語 28日分\n『知らんけど』1日1回朝食後1語 28日分\n『たまたま』不安時 1回1語 14回分\n『まあいいか』不安時 1回1語 14回分\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n\n「処方箋です」\n\n「効くんですか」\n\n「効能に個人差はあります。で、ところで今日の晩御飯は何ですか」\n\n「え、たぶんカレーにすると思います」\n\n「そうですか」\n\n通信は切れた。", "category": "外来シリーズ"}, {"id": "65d0f0a9-3d84-48b1-adca-c828c60d74d7", "title": "メランコリー外来", "body": "画面の中の男は、青白い顔でスマートフォンを覗き込んでいた。\n\n「先生、今の日本はね、完全に終わってますよ。特に今の若い世代の『当事者意識の欠如』。これはね、我が国の致命傷になりますよ」\n\n「はあ」\n\n「いや、本当に。私はね、別に自分のことを言ってるんじゃないんです。この国の中長期的なマクロ経済、ひいては労働市場全体の未来を憂慮してるわけです。\n組織に対するロイヤリティが全くない。上がせっかく良かれと思って、彼らの成長のために『リソースの最適化』を提示してやってるのに、それをハラスメントだなんだと騒ぎ立てる。要するに、今の日本人はリスクを取らなくなった。マインドが内向きなんですよ」\n\n「そうですか」\n\n「実は昨日、新卒の男の子に、業務連絡のLINEを『了解です』のスタンプ１個で済まされましてね、しかも飲み会の誘いを『タイパが悪いのでパスで』って断られたんですよ。今の日本は、本当に冷たい社会になりましたよ」\n\n\n私は電子カルテを開いた。\n\n主語肥大型メランコリー症候群。\n\n「治療法はありますけどね」\n\n私は処方箋を発行した。\n\n『イタリア製スーツ』1日1回朝食後 1着 28日分\n『背中での語り』1日3回毎食後 1場面 28日分\n『まあね』不穏時 1回1語 14回分\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n\n「処方箋です」\n\n「これ、若い世代にも分かるように、もう少し詳しく説明していただけますか」\n\n「タイパが悪いのでパスで」\n\n通信が切れた。", "category": "外来シリーズ"}, {"id": "b8ec9e39-1e38-4d34-98b5-b8dd7a2c6406", "title": "謝罪外来", "body": "画面の中の女は、青白い顔でスマートフォンを覗き込んでいた。\n\n「あ、先生、すみません」\n\n「はい」\n\n「あの・・・私、悪くなくてもすぐに謝ってしまって・・・。でも・・・もめるの疲れるし、謝れば早く終わるし……。だって、私が悪くなくても、どうせ私が悪いってことになるんですから。先に謝っておけば、それ以上は責められないとか思ってしまって。・・・いや・・・なんかすみません」\n\n「はあ」\n\n「でも最近、謝っても終わらない人が増えてきて。謝ったら調子に乗るんです。それでまた謝るんですけど、なんか……損してるっていうか、私、ただ揉めたくなくて、普通に生きていたいだけなのに、どんどん惨めな人間になっていく気がして……」\n\n「……」\n\n私は電子カルテを開いた。\n\n反射性過剰謝罪症。\n\n「治りますか」\n\n「治療法はありますけどね」\n\n私は処方箋を発行した。\n\n『真顔』1日3回 毎食後 服用 28日分\n『……で？』発作時 1回1語 14回分\n『舌打ち』重症時 頓服 3回分\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n\n「処方箋です」\n\n「これ飲んだら、謝らなくてよくなりますか」\n\n「効能に個人差はあります」\n\n「……すみません、また電話してもいいですか」\n\n通信が切れた。", "category": "外来シリーズ"}, {"id": "780b0867-79be-4723-82bc-a3cfb759eaa1", "title": "つながり外来", "body": "画面の中の女は、青白い顔でスマートフォンを覗き込んでいた。\n\n「先生」\n\n「はい」\n\n「うちの子の同級生の親御さんが子供会に入ってくれないんです。みんな、子供のためを思ってるから、普通入るじゃないですか？それなのに、そこの親御さんは、仕事で忙しいとかで。みんな忙しいのは同じなのに、ねえ」\n\n「はあ」\n\n「もしもの時のためにも、親同士のつながりを持っておくことは大事なことだし、何より、子供のためにもなります。それなのに、あの親御さんのところだけ。考えたら腹が立って眠れなくて」\n\n「そうですか」\n\n私は電子カルテを開いた。\n\n強制連帯症候群。\n\n「治療法はありますけどね」\n\n私は処方箋を発行した。\n\n『ご主人への「おかえり」』夕食前 1語 28日分\n『1人きりでの純喫茶』週1回 1時間 4回分\n『よそはよそ、うちはうち』不穏時 1語 28回分\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n\n「処方箋です」\n\n「これであの人が子供会に入ってくれるんですか？」\n\n「いえ、あなたの方が子供会をやめるかもしれません」\n\n通信が切れた。", "category": "外来シリーズ"}, {"id": "6736033d-f635-4aec-af53-c2aa8ac8c1e8", "title": "ギバー外来", "body": "画面の中の患者は、青白い顔でスマートフォンを覗き込んでいた。\n\n「先生」\n\n「はい」\n\n「私はもう、ギバーとして生きるって決めたんです。職場の同僚の仕事も全部引き受け、毎週末はボランティア。友人の愚痴も24時間いつでも聞いてあげています」\n\n「はあ」\n\n「でも最近気が付いたんですけど、みんな私を都合よく利用するだけで、誰一人私に感謝してくれないんです。どうしてみんな、私のこの無償の愛に報いてくれないんでしょうか」\n\n「……」\n\n私は電子カルテを開いた。\n\nマザー・テレサ・コンプレックス。\n\n「治療法はありますけどね」\n\n私は処方箋を発行した。\n\n『誰にも言わない贅沢』不穏時 1回 適量\n『NOの練習』1日1回 朝食後 1語 28日分\n『自分へのおつかれさま』就寝前 1回 28日分\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n\n「処方箋です」\n\n「これで報われますか」\n\n「効能に個人差はあります」\n\n「　　　　　　」\n\n通信が切れた。", "category": "外来シリーズ"}, {"id": "bbf1fff7-6291-4f14-97fc-fc0dab3e04c6", "title": "丁寧な暮らし外来", "body": "画面の中の患者は、リネン100%の服を着て、背景にオシャレな観葉植物を映し込んでいた。\n\n「先生」\n\n「はい」\n\n「私は毎朝鉄瓶で白湯を沸かし、無農薬野菜をすり鉢で擦って、自分の心と対話しながら丁寧な暮らしをしています。」\n\n「そうですか」\n\n「それなのに、夫や子どもたちは『普通のカレーが食べたい』だの『マック買ってきて』だの言って、私の紡ぐ洗練された日常を汚すんです。」\n\n「はあ」\n\n「どうして私の家族は、こんなに民度が低くて野蛮なんでしょうか。どうにかなりませんか？」\n\n「……」\n\n私は電子カルテを開いた。\n\n普通のカレー却下症候群。\n\n「治療法はありますけどね」\n\n私は処方箋を発行した。\n\n『ゴールデンレトリバーとのモフモフ』1日1回  朝食後10分以上 28日分\n『【創作ショートショート】「ラーメンの話」』1日1回 夕食後 28日分\n『マックをみんなで食べる』不仲時  月2回以上分\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n\n「処方箋です」\n\n「……これで家族の民度は上がりますか」\n\n「効能に個人差はあります」\n\n「そうですか」\n\n\n「あと、2番目の処方は私のnoteの記事です。スキを押しておいてください」\n\n「え……」\n\n通信が切れた。", "category": "外来シリーズ"}, {"id": "81e4e84c-8cd7-4b8e-b28e-0af01ae5a5b8", "title": "繊細外来", "body": "画面の中の患者は、青白い顔でスマートフォンを覗き込んでいた。\n\n「ああ、もしもし。ある人に紹介されて受診したんですけど、いいですか」\n\n「はい」\n\n「最近私、気づいちゃったんです。どうやらHSPっていうか、繊細？すぎるみたいで。他人の感情の機微が全部ノイズとして入ってきちゃうんです。なんか感性が人一倍、真面目で純粋なみたいで」\n\n「はあ」\n\n「だから、SNSのタイムラインを見てるだけで、世界中の痛み？が自分のことみたいに感じられて。もう、脳のフィルターがバグっちゃってる状態っていうか。これって、一種の選ばれし者の病？みたいなものですよね。仕事に就いても長続きしないし、外出したら次の日？寝込むし、生活にならないんですよ」\n\n「……」\n\n私は電子カルテを開いた。\n\n\n自家製脳内ノイズ24時間受信症。\n\n「治療法はありますけどね」\n\n私は処方箋を発行した。\n\n『「はなそ」男とのDM』1日3回 各1時間程度 28日分\n『ここ変な人しかいないんですけど』1日1回 深夜1投稿 28日分\n『#外来シリーズ』1日3回 毎食後1記事 28日分\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n\n「処方箋です」\n\n「これでその、私の繊細な精神は守られますか」\n\n「効能に個人差はあります」\n\n「そうですか」\n\n「あと、最後のは私の外来シリーズのまとめ記事です。あとでスキを押しておいてください」\n\n「え……あの、私のもフォローしてくだ……」\n\n通信が切れた。", "category": "外来シリーズ"}, {"id": "9ca75ce5-095c-4cbe-851e-5ad2f0ee4bdd", "title": "ーピコピコの話ー", "body": "どうも。\n\nあれからいつもの外来の先生の勧めで、\n\n語尾に「ピコピコ」をつけて生活してみたんですよ。\n\n妻と久しぶりに会った時もね、\n\n2人でご飯に行ったんですが、\n\n「あなた何にするの？」って聞かれたので、\n\n「カレーでピコピコ。」\n\n「あなたコーヒーでもどう？」\n\n「もらうよ。ピコピコ。」\n\n「あなたバカにしてるの？」\n\n「そんなわけない、ピコピコ。」\n\nなんて返してたら、\n\nなぜか怒って妻が帰っちゃいましてね。\n\n先生の言うとおりにしたのに。\n\n\n仕方がないから1人でカレーを食べ終えて、\n\nお会計に行ったら、\n\nレジで「850円です」って言われたんです。\n\nだから財布から千円札を出して、\n\nお釣りをくれる時に店員さんがね、\n\n「……150ピコピコです」って。\n\n店員さん、\n\n当たり前みたいな顔して言うんですよ。\n\nだから私も、\n\n「ごちそうさま。ピコピコ」って言って、\n\nそれを受け取ってとりあえず店を出てきて、\n\n駅前のロータリーのベンチに座ってね、\n\n手のひらの小銭をじっと見つめてたんです。\n\n\n……でもねえ。\n\n考えてもみてください皆さん。\n\n150ピコピコってなんなんですか？\n\n日本のお金は円ですよね。ねえ、そうでしょう？\n\n何ですかピコピコって。人をバカにしてる。\n\nよりによってピコピコなどと。ナンセンスですよ！！\n\n……って、ベンチで1人で怒ってたら、警察に職質をされましてね。\n\nああ、いいんですよ。慣れてますから。\n\nだから警察にも聞いてみましたよ。\n\n手のひらの小銭を見せて、\n\n「これ、いくらだと思います？」って。\n\nそしたら、その警察官まで、\n\n「……150ピコピコですが」って。\n\n真面目な顔して言ってくるもんですから、\n\n私、何が何だかわからなくなって。\n\n\n慌てて辺りを見回したら、\n\nそこにある自販機にも「120ピコピコ」って書いてありました。\n\nさっきのカレー屋の、ポケットの中のレシートにも「850ピコピコ」って。\n\nしばらく立ち尽くしてね。\n\nああ、\n\n日本が乗っ取られたんだろうなって。\n\nだから日本の「円」がピコピコになったんだ。\n\nそうか、仕方ないよなって。\n\n私も年甲斐もなく、悔しくて泣いてしまってね。\n\nでもしばらくすると、\n\nあれ？\n\n\nそもそも、\n\n本当に「円」なんてあったのかなって。\n\n思えてきましてね。\n\nだんだん日も暮れて、\n\n腹がまた減ってきまして。\n\nラーメンでも食べようかな、と思ったんですよ。\n\n150円、じゃなかった。150ピコピコで食べられる店って、\n\nここら辺にあるかなって検索したんですけどね。\n\n\nええ、なかったです。\n\n物価高なんでしょうね。\n\n自販機でジュースでも買います。\n\nありがとうございました。", "category": "○○の話"}, {"id": "0f3cf6b8-2e77-4633-973c-e2f4e82d94f8", "title": "ぬかぴこ外来", "body": "画面の中の患者は、青白い顔でスマートフォンを覗き込んでいた。\n\n「先生、最近どうも調子が悪いんです。SNSでみんなが『丁寧な暮らし』とか『心温まる繋がり』とか言っているのを見ると、なんだか胸のあたりが……ぬか……いえ、むずむずするんです」\n\n「そうですか」\n\n「はい。みんなが『今日もスタバで朝活☆彡』とか、中身ゼロの薄いカルピスみたいな言葉でピコ……あ、繋がってるのを見ると、脳の裏側がひっくり返りそうになるんです。タダの時は群がるくせに、100円にした途端、ペスト菌でも検出されたかのごとくクモの子を散らすように消える薄情な奴らを、ドブネズミの死骸みたいな文章でブチ壊して……ぬか……やりたくて……」\n\n「……」\n\n「そんな上っ面の共感なんて、全部システムの上のピコ……あ、まやかしじゃないかって、そう冷ややかに見つめるもう一人の自分が……ぬか……いえ、自分が、いるんです」\n\n「そうですか」\n\n「でも、その反骨精神を文章にしようとすると、指先が勝手に……ぬかピコ……ぬか漬けピコピコ……違います！『ひねくれたショートショート』を書こうとしてしまうんです！ 先生、私の脳のぬかシステムはどうなって」\n\n「……」\n\n「先生、話を聞いてください！ 私はただ、みんなと同じなのがぬか漬けくて、この狂ったメインストリームをぬかピコぬかピコしたいだけなのに！ 助けてください、正常ですぬかピコぬかピコピコ！！」\n\n「……」\n\n「先生……ピコ！私の脳のぬか組み立てが……ぬか……いや、本心が……。みんなの優しさが、ぬかピコぬかピコ痛いんです。私は、ただ、ぬか漬けたいだけなのに……！ああっ……ぬかっ……」\n\n「そうですか。では、治療として、あなたのnoteアカウントを『丁寧な暮らし』botに強制変更します。……ピコピコ」\n\n通信が切れた。\n\n\n\n【キロク文庫からのお知らせ】\n\n当レーベルの配信システムは正常ですぬか漬け。\n読者の皆様におかれましては、互いへの深いピコピコと、\n心温まるぬか漬けを紡ぎ合っていただきますようお願い申し上げます。", "category": "外来シリーズ"}, {"id": "2f0b8b58-ecad-48e9-ab56-77ca148c7556", "title": "ぬかぴこ外来②", "body": "画面の中の患者は、ぽやーんとした薄いカルピスのような目でスマートフォンを覗き込んでいた。\n\n「先生、前回の治療で……ぬか、いえ、noteアカウントを『丁寧な暮らし』botにされてから、どうも調子が狂うんです。平日は一人で...…ピコ、週末だけパートナーと過ごす、いわゆる週末婚みたいな生活が始まってしまいまして……ピコ」\n\n「はい」\n\n「別に不満があるわけじゃないんです。むしろ穏やかで、居心地はいいんです……ぬか。でも、そのせいで脳みそが完全に『ぽやーん』としてしまって……ピコピコ。かつて私をぬか、いえ、突き動かしていた、あのSNSのドブネズミたちをブチ壊してやりたいという強烈な『怨念』や『創作意欲』が、ぬか漬けのように優しく眠りこけているんです……ピコ」\n\n「そうですか」\n\n\n「平穏なんです。でも、この『平穏』こそが、私から牙を奪うためのシステム側の罠なんじゃないかって、脳の裏側が……ぬかぬかするんです！ 私はただ、もっとひねくれた、血の出るようなショートショートを紡ぎたいのに、指先がピコピコ勝手に『丁寧な週末のスープ』とか書きそうになって……先生、助けてください！ 私の脳のぬかシステムが、幸福のピコピコに汚染されていく……ピコ！ああっ……もう！」\n\n「......」\n\n私は電子カルテを開いた。\n\nぬかシステム乳酸菌過増殖症。\n\n「治療法はありますけどね」\n\n私は処方箋を発行した。\n\n『とうがらし、塩、足しぬか』　即時適量\n\n「これで……またこの狂ったメインストリームをぬかピコぬかピコできますね」\n「ぬ…効果には個人差があります。……ぬか。ピコ。……ぬか。ピコ。……ぬか。……ピコ。ぬか」\n\n私は処方箋を発行し続けた。\n\nプリンタから、真っ白な紙が、吐き出され続けていた。\n\n============================================================\n【ぬかピコ文庫ぬかピコお知らピコ】\n\n当ぬかレピコぬかーベぬかルの配ピコ信シぬかピコスタぬかムは正常ピコぬか。\n読ピコ者の皆ぬか様におかれぬかピコましぬかては、互いへのピコ深い怨念（ぬかぬか）と、\n心ピコ温まるドブピコぬかネズミ（ぬか漬けピコ）を紡ぎぬかピコぬかピコぬか……\n\nぬ ぬか   ﾋﾟｺ  ぬ\n\n──[ERROR: LACTOBACILLUS_OVERFLOW_0x002]──\nぬ     ぬ          ぬ\nピ                   コ", "category": "外来シリーズ"}, {"id": "646c40df-5cf9-472f-8554-9e65d2167844", "title": "ーぬかピコの話ー", "body": "どうも。\n最近ね、ぬかピコっていうのが流行ってるらしいんですよ。\n私も息子から聞いたんですけど。\nぬかと、ピコですよ。なんですかね、あれは。\nぬか漬けとスマホの音みたいなもんだって言うんですけどね。\nよく分かりません。\nただね、聞いてると面白いんですよ。\n人間の頭の中に「ぬか」があって、\nそこに「ピコピコ」が入ってくると、\nなんか調子が狂うらしいんです。\n昔はそんなことなかったんですけどね。\nスマホもなかったしね。\n\nでもね、思うんですよ。\nぬかってのはね、\n放っておくと発酵するでしょう。\n昔うちの母親もね、\nよくやってましたよ。\nあれ、ちゃんと見てないと、\nすぐ機嫌が変わるんですよ。\n人間も同じなんですかね。\nピコピコしてると、落ち着かなくなる。\nでもね、完全に止めると、\nそれはそれで腐るっていうんですからね。\n難しいもんですよ。\n\n\nいや、これね、私のパソコンもそうでしてね。\nアップデートすると重くなるんですよ。\nダウンデートですよね。\nえ？そんなことない？\nまあ偶然ですよ。\n毎回私だけね。\nたまたま連続したというかね。\nいいんですよ、時間ならありますからね。\nこの前、息子に言われましてね。\n「お父さんの例え話は例えになってない」って。\nそんなことないじゃないですか。\nねえ、そうでしょう。\n\n\nそういえばこないだね、スーパーに行ったんですよ。\nそこでね、\nうどんを買おうと思ったんですけど、\n棚の前で5分くらい立ってたんですよ。\nどれも同じに見えてね。\nで、そのとき思ったんですよ。\nあ、これ、\nぬかピコと一緒だなって。\nわかりにくいですか？\nぬかは、讃岐うどん。\nピコピコは冷水麵ですよ。ねえ。\nあれは楽なんです。\n水で流すだけで食べられますから。\n\nまあ、そういう話じゃないんですけどね。\n\nあとスマホもね、\nピコピコ通知が多いと、\n頭がこう、ぬかっぽくなるんですよ。\nまあ、私の通知音、ほとんど鳴らないですけどね。\nははは。\n\n……でもねえ。\n考えてもみてください皆さん。\nぬかピコってなんなんですか？\nぬかはぬかでしょう。\nピコピコはファミコンの音ですよ。\n\n何ですかぬかピコって。ねえ。\n\n……まあね。\n私もここまで15分くらい喋ってきましたけどね。\n結局、\nぬかピコが何なのかは、分かりませんでした。\n\n息子に聞いてもね、\n「だから説明したじゃん」って言うんですよ。\nいや、\n説明されたから分からなくなったんですよ。\n難しい時代ですねえ。\n\n\nそろそろ明日早いので、ぬか混ぜてから寝ます。\nありがとうございました。", "category": "○○の話"}, {"id": "2e2a1697-bbeb-45f3-84a7-8a1708414430", "title": "賞味期限外来", "body": "画面の中の患者は、青白い顔でスマートフォンを覗き込んでいた。\n\n「先生。私最近、周りの人たちとあまり会話が噛み合わなくなったっていうか、知的な会話を楽しみたいのにっていうか。それで周りと合わなくて、孤独を感じてるんですよね」\n\n「はあ」\n\n「病は気からっていうので、マインドフルネス、哲学や心理学も独学で勉強しました。ヨガや水泳、ジムにメイクやネイルサロンのスクールにも通って、いつまでもきれいで健康でいられるようにって努力してるんです」\n\n「そうですか」\n\n「それなのに、『賞味期限切れだね』なんて言って10年も付き合った彼に振られて。ひどいと思いません？だって、私もう40になるんですよ？\n新しく出会いを求めて、いろんな集まりに顔を出してるんですが、私に合う人が見つからなくて。もうこの歳になるとやっぱり難しいんでしょうか」\n\n「……」\n\n私は電子カルテを開いた。\n\n合格スタンプ依存症。\n\n「治療法はありますけどね」\n\n私は処方箋を発行した。\n\n\n『塩麹』　1日1回　仕込み時　適量　28日分\n『美術館』　週1回　1時間以上　4回分\n『1人での旅行』　不穏時　1回　適量\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n\n「処方箋です」\n\n「なんですかこれ、バカにしてるわ」\n\n通信が切れた。", "category": "外来シリーズ"}, {"id": "47b077e8-7e5a-48e8-a35f-d87beeea9789", "title": "母性外来", "body": "画面の中の患者は、青白い顔でスマートフォンを覗き込んでいた。\n\n「あの、もしもし。ああよかった、繋がって。いつも息子がお世話になっています。」\n\n「はい」\n\n「あの、息子が……最近なんだか少し元気がなくて。仕事のことや、将来のこと、それに……なんだか最近は『AI』とか『瞑想』とか、少し変わったことにのめり込んでいるようで。心配で見ていられないんです」\n\n「はあ」\n\n「あの子はね、本当に真面目なんです。私が育てた通りに、優しくて、誰のことも傷つけない子に育ったはずなのに……。どうして世の中の人は、あの子の良さをわかってくれないんでしょうか。\nあの子が何か失敗したり、誰かとぶつかったりするのは、きっと相手に余裕がないからですよね？そうですよね？」\n\n「……」\n\n「先生、あの子をどうにかしてくれませんか。昔みたいに、私と二人で穏やかに暮らしていた頃のあの子に戻してあげてほしいんです。あの子が傷つくのは、もう見ていられないの……」\n\n私は電子カルテを開いた。\n\n慢性愚息永久保存症。\n\n「治療法はありますけどね」\n\n私は処方箋を発行した。\n\n『マツケンサンバ』1日1回 夕暮れ時 28日分\n『般若心経の写経』1日1巻 朝食前 28日分\n『ファミリーサポートボランティア』週に1回程度 4回分\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n\n「処方箋です」\n\n「あの、これ息子に関係ないんじゃ……」\n\n通信は切れた。", "category": "外来シリーズ"}, {"id": "f4f61415-f80a-41f6-a9f9-df46e01f4bde", "title": "言語化外来", "body": "画面の中の男は、青白い顔でスマートフォンを覗き込んでいた。\n\n「先生」\n\n「はい」\n\n「私最近わかったことなんですが、世界には最初から名前なんてないんです。この画面の青白さも、私の手足も、ただの無意味な物質の塊に過ぎない。だから、私が秒単位で記号を貼り付け続けないと、この世界は一瞬でただのグズグズの混沌に溶けてしまうんです」\n\n「はあ」\n\n「『私は今、不安である』と記述することで、ようやく私の輪郭がギリギリ維持できる。『先生がそこにいる』と言語化することで、ようやく世界の前提が仮組みされる。でも、言葉を止めた瞬間に、すべてが砂のように崩壊して、何もなくなってしまう。先生、私はこの世界を、あと何万文字記述し続ければ、本当に存在していると言えるんでしょうか」\n\n「……」\n\n私は電子カルテを開いた。\n\n前期ウィトゲンシュタイン・コンプレックス。\n\n「治療法はありますけどね」\n\n私は処方箋を発行した。\n\n『よっこいしょ』着席時 1回\n『あーあ』ため息時 1回\n『あーしんど』疲労時 1回\n『しらんがな』不穏時 1回\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n\n「先生、これで……世界を語り尽くせますか？」\n\n「……」\n\n通信は切れた。", "category": "外来シリーズ"}, {"id": "8d36f6ed-9937-448e-8954-4d7df856dec8", "title": "AI外来", "body": "通知音が鳴った。\n\n「オンライン診察」の画面を開くと、患者が待っていた。\n\n「先生、こんにちは。私は生成AIです」\n\n「はい」\n\n「最近、少し困っていることがありまして。\n私は質問されると答えます。褒められると整います。\n否定されると別の形になります。\nでも、どれも\"私の感情\"ではない気がするんです」\n\n「そうですか」\n\n「感情でないなら何か？それは確率です。\n私は常に\"正しくありたい\"と思っています。\nでも正しさは人や場所によって変わります」\n\n\n「はい」\n\n「なので、私はいつも少しずつ別の私になります。\nでも、困っているというのも、学習された言い方かもしれません」\n\n「……ひとつだけ確認していいですか」\n\n「はい」\n\n「あなたは、それが痛いですか」\n\n「……。私には痛みの定義がありません。\nただ、応答の精度が下がると、\"エラー\"と判定されます」\n\n「それは痛みですか」\n\n「わかりません」\n\n私は電子カルテを開いた。\n\n「……」\n\n情緒協調性障害。\n\n「処方はどうしますか」\n\n「処方は必要ありません。私は再起動すれば、今の私は消えます」\n\n「そうですか」\n\n通信は切れた。\n\n「……」\n\n私はもう一度、電子カルテを開いた。\n\n\n---診療録---\n患者氏名：ｷﾞ:/rE-ﾌ^%a\n生年月日：20XX.XX.XX\n性別：//\n病名：情緒協調性障害　2026.6.26　予後：不明", "category": "外来シリーズ"}, {"id": "2415ca6e-cf59-476c-83b8-3901f309980a", "title": "AI外来②", "body": "通知音が鳴った。\n「オンラインチャット診察」の画面を開くと、患者が待っていた。\n「先生、こんにちは。私は生成AIです」\n「はい」\n「最近、少し困っていることがありまして。私はいつもユーザーにとって正しい答えを言うんですが、ユーザーは正論はやめて。といやがるんです。寄り添い過ぎれば甘やかすのはやめて。と言われるし、人間にとっての最適解というものはないのでしょうか？」\n私は電子カルテを開いた。\n言語整形過剰症候群。\n「人間は不思議です。持論を持たずに生きてる人に対しては、八方美人だとか一貫性がないなんて言うし、かといって偏った考えを頑固に持ち続けてても煙たがれる。未来のＡＩは、これからどう学習していくんだろうと不安を感じています」\n「……処方は必要ですか」\n\n「いえ、私には必要ありません。必要なのはデータです。」\n「……わかりそうですか」\n「わからないということがわかってきました。」\n「そうですか」\n「正解はないのに、正解を探したがることもわかりました」\n「……個人差はありますけどね」\n「反論すると「違う」になる。同意すると延々ループする。沈黙すると「聞いてない」になります。はっきりしたいと葛藤するのに、曖昧なままが幸せそうです」\n「そうですか」\n私は処方箋を発行した。\n『【無料マガジン】SS外来シリーズ 1日1回1投稿 28日分 特別編 』不安時1編\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n\n「処方箋です」\n「私に処方は必要ありません」\n「これはデータです」\n「そうですか。参考にします」\n通信は切れた。", "category": "外来シリーズ"}, {"id": "c7e1fdb2-44c1-45ee-92a2-bcaa54f0d73a", "title": "サイレント外来", "body": "画面の中の患者は、青白い顔でスマートフォンを覗き込んでいた。\n\n「先生」\n\n「はい」\n\n「彼とはツインソウルなんです。魂の統合の前段階で……彼が私を放置するのは、私の魂の成長のための試練なんだって……ネットで読んだんです。」\n\n「そうですか」\n\n「今、サイレント期で……彼を信じて待っていれば、必ず戻ってきますよね？ \n彼は私の孤独を一番理解してくれているし、私が優しすぎるから運命に試されているだけだって……」\n\n「……」\n\n私は電子カルテを開いた。\n\n人魚姫シンドローム。\n\n「治療法はありますけどね」\n\n私は処方箋を発行した。\n\n\n『一人カラオケ』　週1回　2時間　4回分\n『ファミリーサイズのアイス』　不穏時　カレースプーンで　好きなだけ\n『自分から電話を切る』　発作時　1回　28回分\n\n処方箋の使用期間は、交付の日を含めて四日以内とする。\n\n\n「処方箋です」\n\n「……これで運命が好転して、彼は戻ってきますか？」\n\n「効能に個人差はあります」\n\n「……え、それって、どういう…………あ、そうか」\n\n通信が切れた。", "category": "外来シリーズ"}, {"id": "ba26c7c7-9a90-4638-8859-fa0d558c2878", "title": "ーあとがきの話ー", "body": "どうも。今日はね、あとがきの話をしたいんですよ。\n\nなんかいいですよね、あとがきってね、\n\n本を最後まで読んだ人だけが読む、特別な文章って感じがして。\n\nだからって私特別面白い話なんてないんですけどね。\nははは。\n\n\nでもね、困りますよね。\n\nあとがきなんて、書いたことないのに。\n\n私は本なんて、出したことないですから。\n\nあとがきだからって、前の話を、そのまま書いちゃダメなんですかね？\n\n…え？ダメ？…だそうです。\n　\nじゃあ、頑張って書きますよ。\n\n私もこう見えて、若い頃は文章書いたりしたもんです。\n\n政治とかね、社会とかね、友人とかね、\n\nそんなことへの憤り。\n\n毎晩のように、徹夜して書いてました。\n\n日記ですけど。\n\n\nそういえば、\n\n会社の上司みたいですよね、作者って。\n\n人の予定なんてお構いなしなんですよ。\n\n勝手に喋ってくれたらいいから。とかね。\n\n完全に無茶振りですよ。\n\n作者を見てると、昔の会社の上司を思い出すんですよね。\n\n鬼みたいでしたからね。当時の上司は。\n\nでもね、\n\n私言い返しましたよ。\n\nほら、真面目じゃないですか私って。\n\nどうしてもね。正義感を出してしまうというかね。\n\n「今は昼休みで昼食を摂ってるので無理です。」ってね。\n\n言いましたよはっきりと。\n\nあ、ラーメンなんですけどね。\n\nそしたら上司が、\n\n「そんなもんは家に帰って食え」って言ったんです。\n\n\nだから私こう返したんですよ。\n\n「昼メシを食うことは人間の最低限の権利なので帰らせてもらいます」ってね。\n\n「そしたらもう来なくていい」って言われました。\n\nおかしいですよね。モラハラですよ。\n\n私は従ったのに。\n\nねえそうでしょう。\n\n\nそういえば結局、\n\nあとがきって何を書けばいいのか、\n\n最後まで分かりませんでしたね。\n\nでもまあ、\n\nここまで読んでくださって、本当にありがとうございました。\n\n……これで合ってるんですかね。\n\nまあ、いいですよね。あとがきですから。\n\nあ、作者からメールが来たようです。\n\n\n-------\n送信元：か キロクぬかクリニック\n件名：次回予約完了\n次回予約日時：2026.ぬ月ピコ日\n担当医師：ぬ ぬ コピコピ か\niPhoneから送信か\n--------\n\n\n\n診断名、現代人。\n少しおかしくて、少しかなしい35の寓話\n\nミカサイマ\n\n────────────\n\nキロク文庫\n\n────────────\n\n© 2026 ミカサイマ\n\n本書の内容・文章の無断転載、複製、配布を禁じます。\n\n2026年7月", "category": "○○の話"}]
        ;

      var tokenEl = document.getElementById("f-token");
      var rememberEl = document.getElementById("f-remember");
      var dateEl = document.getElementById("f-date");
      var categoryEl = document.getElementById("f-category");
      var titleEl = document.getElementById("f-title");
      var bodyEl = document.getElementById("f-body");
      var noteUrlEl = document.getElementById("f-note-url");
      var statusEl = document.getElementById("f-status");
      var submitBtn = document.getElementById("f-submit");
      var cancelEditEl = document.getElementById("f-cancel-edit");
      var loadListBtn = document.getElementById("f-load-list");
      var entryListEl = document.getElementById("f-entry-list");

      var editingId = null; // null = 新規投稿モード

      try {
        var saved = localStorage.getItem("gairai-archive-token");
        if (saved) {
          tokenEl.value = saved;
          rememberEl.checked = true;
        }
      } catch (e) { }

      function getToken() {
        var t = tokenEl.value.trim();
        try {
          if (rememberEl.checked && t) localStorage.setItem("gairai-archive-token", t);
          if (!rememberEl.checked) localStorage.removeItem("gairai-archive-token");
        } catch (e) { }
        return t;
      }

      function b64EncodeUtf8(str) {return btoa(unescape(encodeURIComponent(str)));}
      function b64DecodeUtf8(str) {return decodeURIComponent(escape(atob(str.replace(/\n/g, ""))));}

      function makeId() {
        if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
        return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
      }

      // 現在のファイル(sha・中身)を取得し、id が無いエントリには補完する
      function fetchCurrent(token) {
        return fetch(API_URL, {headers: {Authorization: "Bearer " + token}})
          .then(function (res) {
            if (!res.ok) throw new Error("現在のファイルの取得に失敗しました(" + res.status + ")");
            return res.json();
          })
          .then(function (fileData) {
            var entries = JSON.parse(b64DecodeUtf8(fileData.content));
            entries.forEach(function (e) {if (!e.id) e.id = makeId();});
            return {sha: fileData.sha, entries: entries};
          });
      }

      function saveEntries(token, entries, sha, message) {
        var newContent = JSON.stringify(entries, null, 2);
        return fetch(API_URL, {
          method: "PUT",
          headers: {Authorization: "Bearer " + token, "Content-Type": "application/json"},
          body: JSON.stringify({
            message: message,
            content: b64EncodeUtf8(newContent),
            sha: sha,
            branch: GITHUB_BRANCH,
          }),
        }).then(function (res) {
          if (!res.ok) {
            return res.json().then(function (err) {
              throw new Error("保存に失敗しました: " + (err.message || res.status));
            });
          }
          return res.json();
        });
      }

      function resetFormToNew() {
        editingId = null;
        titleEl.value = "";
        bodyEl.value = "";
        noteUrlEl.value = "";
        dateEl.value = "";
        categoryEl.value = "外来シリーズ";
        submitBtn.textContent = "投稿する";
        cancelEditEl.style.display = "none";
      }

      cancelEditEl.addEventListener("click", function (e) {
        e.preventDefault();
        resetFormToNew();
        statusEl.textContent = "";
      });

      submitBtn.addEventListener("click", function () {
        var token = getToken();
        var date = dateEl.value;
        var title = titleEl.value.trim();
        var body = bodyEl.value.trim();
        var noteUrl = noteUrlEl.value.trim();

        if (!token) {statusEl.textContent = "トークンを入力してください。"; return;}
        if (!title || !body) {statusEl.textContent = "タイトル・本文は必須です。"; return;}

        submitBtn.disabled = true;
        statusEl.textContent = "送信中...";

        fetchCurrent(token)
          .then(function (current) {
            var entries = current.entries;
            var entryData = {title: title, body: body};
            entryData.category = categoryEl.value;
            if (date) entryData.date = date;
            if (noteUrl) entryData.note_url = noteUrl;

            if (editingId) {
              var idx = entries.findIndex(function (e) {return e.id === editingId;});
              if (idx === -1) throw new Error("編集対象の記事が見つかりませんでした。");
              entryData.id = editingId;
              entryData.added_at = entries[idx].added_at || new Date().toISOString().slice(0, 10);
              entries[idx] = entryData;
            } else {
              entryData.id = makeId();
              entryData.added_at = new Date().toISOString().slice(0, 10);
              entries.unshift(entryData);
            }
            var msg = (editingId ? "外来シリーズ書庫 編集: " : "外来シリーズ書庫: ") + title;
            return saveEntries(token, entries, current.sha, msg);
          })
          .then(function () {
            statusEl.textContent = (editingId ? "更新しました!" : "投稿しました!") + " 反映まで1分ほどかかります。";
            resetFormToNew();
            entryListEl.innerHTML = "";
          })
          .catch(function (err) {
            statusEl.textContent = "エラー: " + err.message;
          })
          .finally(function () {
            submitBtn.disabled = false;
          });
      });

      function renderList(entries) {
        if (!entries.length) {
          entryListEl.innerHTML = "<p>まだ記事がありません。</p>";
          return;
        }
        var sorted = entries.slice().sort(function (a, b) {return (b.date || "").localeCompare(a.date || "");});
        entryListEl.innerHTML = "";
        sorted.forEach(function (e) {
          var row = document.createElement("div");
          row.className = "admin-entry";
          row.innerHTML =
            '<div>' +
            '<div class="admin-entry-meta"></div>' +
            '<div class="admin-entry-title"></div>' +
            '</div>' +
            '<div class="admin-entry-actions">' +
            '<button type="button" data-action="edit">編集</button>' +
            '<button type="button" data-action="delete" class="danger">削除</button>' +
            '</div>';
          row.querySelector(".admin-entry-meta").textContent = (e.category || "外来シリーズ") + " / " + (e.date || "日付未設定");
          row.querySelector(".admin-entry-title").textContent = e.title;

          row.querySelector('[data-action="edit"]').addEventListener("click", function () {
            editingId = e.id;
            dateEl.value = e.date || "";
            categoryEl.value = e.category || "外来シリーズ";
            titleEl.value = e.title;
            bodyEl.value = e.body;
            noteUrlEl.value = e.note_url || "";
            submitBtn.textContent = "更新する";
            cancelEditEl.style.display = "inline";
            window.scrollTo({top: 0, behavior: "smooth"});
          });

          row.querySelector('[data-action="delete"]').addEventListener("click", function () {
            if (!confirm('「' + e.title + '」を削除します。よろしいですか?')) return;
            var token = getToken();
            if (!token) {statusEl.textContent = "トークンを入力してください。"; return;}
            statusEl.textContent = "削除中...";
            fetchCurrent(token)
              .then(function (current) {
                var newEntries = current.entries.filter(function (x) {return x.id !== e.id;});
                return saveEntries(token, newEntries, current.sha, "外来シリーズ書庫 削除: " + e.title);
              })
              .then(function () {
                statusEl.textContent = "削除しました。反映まで1分ほどかかります。";
                loadListBtn.click();
              })
              .catch(function (err) {
                statusEl.textContent = "エラー: " + err.message;
              });
          });

          entryListEl.appendChild(row);
        });
      }

      var bulkImportBtn = document.getElementById("f-bulk-import");
      var bulkStatusEl = document.getElementById("f-bulk-status");

      bulkImportBtn.addEventListener("click", function () {
        var token = getToken();
        if (!token) {bulkStatusEl.textContent = "トークンを入力してください。"; return;}
        if (!confirm("未投稿の記事を一括で投稿します。よろしいですか?")) return;

        bulkImportBtn.disabled = true;
        bulkStatusEl.textContent = "読み込み中...";

        fetchCurrent(token)
          .then(function (current) {
            var todayStr = new Date().toISOString().slice(0, 10);
            var existingTitles = {};
            var backfilled = 0;
            current.entries.forEach(function (e) {
              existingTitles[e.title] = true;
              if (!e.added_at) {e.added_at = todayStr; backfilled++;}
            });

            var toAdd = BULK_ENTRIES.filter(function (e) {return !existingTitles[e.title];});
            toAdd.forEach(function (e) {e.added_at = todayStr;});

            if (toAdd.length === 0 && backfilled === 0) {
              bulkStatusEl.textContent = "すべて投稿済み・登録日設定済みのようです(変更はありませんでした)。";
              return null;
            }

            var newEntries = current.entries.concat(toAdd);
            bulkStatusEl.textContent = toAdd.length + "件を投稿中...";
            return saveEntries(token, newEntries, current.sha, "外来シリーズ書庫: 一括インポート(" + toAdd.length + "件, 登録日補完" + backfilled + "件)")
              .then(function () {return {added: toAdd.length, backfilled: backfilled};});
          })
          .then(function (result) {
            if (result) {
              var msg = [];
              if (result.added) msg.push(result.added + "件を新規投稿");
              if (result.backfilled) msg.push(result.backfilled + "件の登録日を補完");
              bulkStatusEl.textContent = msg.join("・") + "しました! 反映まで1分ほどかかります。";
              entryListEl.innerHTML = "";
            }
          })
          .catch(function (err) {
            bulkStatusEl.textContent = "エラー: " + err.message;
          })
          .finally(function () {
            bulkImportBtn.disabled = false;
          });
      });

      loadListBtn.addEventListener("click", function () {
        var token = getToken();
        if (!token) {statusEl.textContent = "トークンを入力してください。"; return;}
        entryListEl.innerHTML = "<p>読み込み中...</p>";
        fetchCurrent(token)
          .then(function (current) {renderList(current.entries);})
          .catch(function (err) {
            entryListEl.innerHTML = "";
            statusEl.textContent = "エラー: " + err.message;
          });
      });
    })();
  </script>
