<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ピコぬGIFバナー工房 Ver1.00</title>
<style>
body{margin:0;padding:12px;background:#008080;font-family:"ＭＳ Ｐゴシック","MS PGothic","Osaka",sans-serif;font-size:13px;color:#000;line-height:1.5}
#win{max-width:560px;margin:0 auto;background:#c0c0c0;border:2px outset #fff;box-shadow:2px 2px 0 #000}
.title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:3px 6px;display:flex;justify-content:space-between}
.title span.btns b{display:inline-block;width:16px;height:14px;background:#c0c0c0;border:2px outset #fff;color:#000;font-size:10px;line-height:12px;text-align:center;margin-left:2px}
.menu{padding:2px 6px;border-bottom:1px solid #808080}
.menu span{margin-right:14px}
.body{padding:8px}
fieldset{border:2px groove #fff;margin:0 0 8px;padding:6px 10px 8px}
legend{padding:0 4px}
.row{display:flex;align-items:center;gap:8px;margin:4px 0;flex-wrap:wrap}
.row label{min-width:88px}
input[type=text],textarea,select{font-family:inherit;font-size:13px;background:#fff;border:2px inset #fff;padding:1px 3px}
textarea{width:16em;resize:none}
input[type=color]{width:44px;height:24px;padding:0;border:2px inset #fff;background:#c0c0c0}
button,a.btn{font-family:inherit;font-size:13px;background:#c0c0c0;border:2px outset #fff;padding:3px 14px;color:#000;text-decoration:none;cursor:pointer;display:inline-block}
button:active,a.btn:active{border-style:inset}
.prev{background:#fff;border:2px inset #fff;padding:8px;text-align:center}
.prev img{display:inline-block;vertical-align:middle;image-rendering:pixelated}
.big{width:100%;max-width:352px;height:auto;aspect-ratio:88/31}
.note{font-size:12px;color:#000080}
.status{border-top:1px solid #808080;padding:2px 8px;font-size:12px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div id="win">
  <div class="title"><span>ピコぬGIFバナー工房 Ver1.00</span><span class="btns"><b>_</b><b>□</b><b>×</b></span></div>
  <div class="menu"><span>ファイル(F)</span><span>編集(E)</span><span>表示(V)</span><span>ヘルプ(H)</span></div>
  <div class="body">
    <fieldset><legend>1. バナー文字</legend>
      <div class="row"><label for="txt">文字(2行まで)</label><textarea id="txt" rows="2" maxlength="40">ピコぬ新聞社</textarea></div>
      <div class="row"><label for="badge">バッジ</label>
        <select id="preset"><option value="">(なし)</option><option>NEW!</option><option>おすすめ!</option><option>広告募集中!</option><option>UP!</option><option>キリ番!</option><option value="__">自由入力</option></select>
        <input type="text" id="badge" size="10" maxlength="8" value="NEW!"></div>
    </fieldset>
    <fieldset><legend>2. 色・点滅</legend>
      <div class="row"><label for="bg">背景色</label><input type="color" id="bg" value="#0000cc"> <label for="fg" style="min-width:0">文字色</label><input type="color" id="fg" value="#ffffff"></div>
      <div class="row"><label for="spd">点滅速度</label>
        <select id="spd"><option value="0">静止</option><option value="100">ゆっくり</option><option value="50" selected>ふつう</option><option value="25">はやい</option><option value="10">超はやい</option></select></div>
      <div class="row"><label for="frame">枠線</label><input type="checkbox" id="frame" checked> <label for="frame" style="min-width:0">つける</label></div>
    </fieldset>
    <fieldset><legend>3. できあがり(88×31 GIF)</legend>
      <div class="prev"><img id="out" alt="作成したバナー" width="88" height="31"><br><br><img id="outBig" class="big" alt="拡大表示"></div>
      <div class="row" style="margin-top:8px"><a class="btn" id="dl" download="banner.gif" href="#">保存(S)</a> <button type="button" id="about">バージョン情報</button> <span class="note" id="size"></span></div>
    </fieldset>
    <div class="note">※画像を右クリック→「名前を付けて画像を保存」でも保存できます。</div>
  </div>
  <div class="status"><span>準備完了</span><span>(C)ピコぬ新聞社 2001 / フリーソフト</span></div>
</div>
<script>
(function(){
'use strict';
var W=88,H=31,$=function(i){return document.getElementById(i)};
var off=document.createElement('canvas');off.width=W;off.height=H;
var ox=off.getContext('2d',{willReadFrequently:true});

function rgb(h){return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];}
function fnt(p,b){return (b?'bold ':'')+p+'px "ＭＳ Ｐゴシック","MS PGothic","Osaka","Meiryo","Hiragino Kaku Gothic ProN",sans-serif';}

// 文字を4倍の大きさで描いてから88×31に縮小し、濃淡(0〜7)のマスクを返す
var S=4,big=document.createElement('canvas');big.width=W*S;big.height=H*S;
var bx2=big.getContext('2d',{willReadFrequently:true});
function mask(lines,bx,by,bw,bh,maxPx,bold){
  var n=lines.length,px=Math.min(maxPx,Math.floor(bh/n)),minPx=n>1?8:10,wid;
  function calc(){bx2.font=fnt(px*S,bold);return Math.max.apply(null,lines.map(function(l){return bx2.measureText(l).width;}))/S;}
  wid=calc();
  while(wid>bw&&px>minPx){px--;wid=calc();}
  var sx=wid>bw?bw/wid:1;
  bx2.clearRect(0,0,W*S,H*S);bx2.fillStyle='#000';bx2.textAlign='center';bx2.textBaseline='middle';
  bx2.save();bx2.translate((bx+bw/2)*S,0);bx2.scale(sx,1);
  lines.forEach(function(l,i){bx2.fillText(l,0,(by+bh*(i+0.5)/n)*S);});
  bx2.restore();
  var d=bx2.getImageData(0,0,W*S,H*S).data,m=new Uint8Array(W*H),x,y,u,v,sum,a;
  for(y=by;y<by+bh;y++)for(x=bx;x<bx+bw;x++){
    sum=0;
    for(v=0;v<S;v++)for(u=0;u<S;u++)sum+=d[(((y*S+v)*W*S)+(x*S+u))*4+3];
    a=Math.min(1,sum/(S*S*255)*1.3);
    m[y*W+x]=Math.round(a*7);
  }
  return {m:m,w:Math.ceil(wid*sx)};
}

// パレット: 0〜7=背景→文字色の濃淡 / 8〜15=バッジ地→バッジ文字の濃淡
function frame(inv,o){
  var f=new Uint8Array(W*H),i,x,y,l;
  f.fill(inv?7:0);
  if(o.frame){for(i=0;i<W;i++){f[i]=7;f[(H-1)*W+i]=7;}for(i=0;i<H;i++){f[i*W]=7;f[i*W+W-1]=7;}}
  if(o.tag){
    var tw=Math.min(84,o.tag.w+4),rx=Math.floor(o.x0+(o.bw-tw)/2);
    for(y=2;y<13;y++)for(x=rx;x<rx+tw;x++)f[y*W+x]=inv?15:8;
    for(i=0;i<f.length;i++){l=o.tag.m[i];if(l)f[i]=inv?15-l:8+l;}
  }
  for(i=0;i<f.length;i++){l=o.main.m[i];if(l)f[i]=inv?7-l:l;}
  return f;
}

// LZW + GIF89a
function lzw(px,mcs){
  var clear=1<<mcs,eoi=clear+1,size=mcs+1,next=eoi+1,dict=new Map(),out=[],cur=0,nb=0,i;
  function put(c){cur|=c<<nb;nb+=size;while(nb>=8){out.push(cur&255);cur>>=8;nb-=8;}}
  put(clear);
  var prefix=px[0];
  for(i=1;i<px.length;i++){
    var k=px[i],key=(prefix<<8)|k;
    if(dict.has(key)){prefix=dict.get(key);}
    else{
      put(prefix);
      if(next<4096){dict.set(key,next++);if(next>(1<<size)&&size<12)size++;}
      else{put(clear);dict.clear();size=mcs+1;next=eoi+1;}
      prefix=k;
    }
  }
  put(prefix);put(eoi);
  if(nb>0)out.push(cur&255);
  return out;
}
function gif(frames,pal,delay){
  var b=[];
  function w16(v){b.push(v&255,(v>>8)&255);}
  function str(s){for(var i=0;i<s.length;i++)b.push(s.charCodeAt(i));}
  str('GIF89a');w16(W);w16(H);b.push(0xF3,0,0);
  pal.forEach(function(c){b.push(c[0],c[1],c[2]);});
  if(frames.length>1){b.push(0x21,0xFF,0x0B);str('NETSCAPE2.0');b.push(3,1,0,0,0);}
  frames.forEach(function(f){
    b.push(0x21,0xF9,4,0x04);w16(delay);b.push(0,0);
    b.push(0x2C);w16(0);w16(0);w16(W);w16(H);b.push(0);
    b.push(4);
    var d=lzw(f,4);
    for(var i=0;i<d.length;i+=255){var n=Math.min(255,d.length-i);b.push(n);for(var j=0;j<n;j++)b.push(d[i+j]);}
    b.push(0);
  });
  b.push(0x3B);
  return new Uint8Array(b);
}

var url=null;
function make(){
  var lines=$('txt').value.split(/\r?\n/).filter(function(s){return s.trim()!=='';}).slice(0,2);
  if(!lines.length)lines=[' '];
  var badge=$('badge').value.trim(),hasF=$('frame').checked;
  var x0=hasF?2:1,bw=W-x0*2;
  var tag=badge?mask([badge],2,2,bw,11,10,true):null;
  var top=tag?13:x0,bh=(H-x0)-top;
  var main=mask(lines,x0,top,bw,bh,tag?16:22,true);
  var o={frame:hasF,tag:tag,main:main,x0:x0,bw:bw};
  var spd=parseInt($('spd').value,10);
  var frames=[frame(false,o)];
  if(spd>0)frames.push(frame(true,o));
  var bg=rgb($('bg').value),fg=rgb($('fg').value);
  var pal=[],k,c;
  function mix(a,b,t){return [Math.round(a[0]+(b[0]-a[0])*t),Math.round(a[1]+(b[1]-a[1])*t),Math.round(a[2]+(b[2]-a[2])*t)];}
  for(k=0;k<8;k++)pal.push(mix(bg,fg,k/7));
  for(k=0;k<8;k++)pal.push(mix([255,0,0],[255,255,0],k/7));
  var bytes=gif(frames,pal,spd||100);
  if(url)URL.revokeObjectURL(url);
  url=URL.createObjectURL(new Blob([bytes],{type:'image/gif'}));
  $('out').src=url;$('outBig').src=url;$('dl').href=url;
  $('size').textContent='ファイルサイズ: '+bytes.length+' バイト';
}

$('preset').addEventListener('change',function(){
  if(this.value==='__'){$('badge').focus();return;}
  $('badge').value=this.value;make();
});
['txt','badge','bg','fg','spd','frame'].forEach(function(id){
  $(id).addEventListener('input',make);$(id).addEventListener('change',make);
});
$('about').addEventListener('click',function(){
  alert('ピコぬGIFバナー工房 Ver1.00\n(C)ピコぬ新聞社 2001\n\nこのソフトはフリーソフトです。\n作ったバナーは自由にお使いください。');
});
make();
})();
</script>
</body>
</html>
