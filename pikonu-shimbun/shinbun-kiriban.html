<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>キリ番通過チェッカー - ピコぬ新聞社公式BBS</title>
  <style>
    body {
      background-color: #000022;
      color: #ffffff;
      font-family: "ＭＳ Ｐゴシック", "MS PGothic", sans-serif;
      font-size: 12px;
      line-height: 1.5;
      margin: 15px;
    }

    .kiriban-box {
      width: 450px;
      max-width: 100%;
      box-sizing: border-box;
      margin: 0 auto;
      background-color: #111133;
      border: 2px ridge #5555aa;
      padding: 15px;
      text-align: center;
    }

    .counter-display {
      background-color: #000000;
      color: #00ff00;
      font-family: "Courier New", monospace;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 3px;
      border: 2px inset #666666;
      padding: 8px 15px;
      display: inline-block;
      margin: 10px 0;
    }

    .btn-check {
      background-color: #333366;
      color: #ffff00;
      border: 2px outset #666699;
      font-family: "ＭＳ Ｐゴシック", sans-serif;
      font-size: 12px;
      padding: 4px 12px;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-check:active {
      border-style: inset;
    }

    #result-msg {
      margin-top: 15px;
      padding: 10px;
      background-color: #220000;
      border: 1px solid #880000;
      color: #ffaaaa;
      font-size: 11px;
      text-align: left;
      display: none;
    }

    .notice-text {
      font-size: 10px;
      color: #8888aa;
      margin-top: 12px;
    }

    .back-link {
      margin-top: 15px;
      font-size: 11px;
    }

    .back-link a {
      color: #00ffff;
    }

    .back-link a:visited {
      color: #cc99ff;
    }
  </style>
</head>

<body>

  <div class="kiriban-box">
    <div style="color: #00ffff; font-weight: bold; font-size: 13px;">
      ■ 掲示板アクセス記念・7777キリ番チェッカー
    </div>
    <div style="font-size: 11px; color: #cccccc; margin-top: 5px;">
      現在のカウント（キリ番「7777」まであと 1 アクセス！）
    </div>

    <!-- カウンター（最初から7776が表示されている） -->
    <div class="counter-display" id="counter">007776</div>
    <br>

    <button class="btn-check" onclick="tryKiriban()">［ カウンターを更新してキリ番を踏む！ ］</button>

    <!-- 結果メッセージ表示エリア -->
    <div id="result-msg"></div>

    <div class="notice-text">
      ※当サイトのアクセスカウンターはサーバー負荷軽減のため、定期的に減算処理を行っております。<br>
      ※キリ番報告のお問い合わせメールには返信いたしかねます（Web管理担当）。
    </div>

    <div class="back-link">
      [ <a href="index.html">←新聞社に戻る</a> ]
    </div>
  </div>

  <script>
    let clicked = false;

    function tryKiriban() {
      const counterEl = document.getElementById('counter');
      const msgEl = document.getElementById('result-msg');

      if (!clicked) {
        // 1回目のクリック：自動減算が発動して7771に飛ぶ
        counterEl.textContent = '007771';
        counterEl.style.color = '#ff3333'; // 一瞬赤くなる

        msgEl.innerHTML = `
      <b>【エラー：キリ番通過失敗】</b><br>
      申し訳ありません。あなたがボタンを押した直前（5分おきの自動減算シークエンス）により、カウンターが <b>-5</b> 減算されました。<br><br>
      現在値：<b>007771</b><br>
      ※7777番は正常にスキップ（減算）されました。物理的に踏むことはできません。
    `;
        msgEl.style.display = 'block';
        clicked = true;
      } else {
        // 2回目以降のクリック：さらに減って離れていく
        let current = parseInt(counterEl.textContent, 10);
        current -= Math.floor(Math.random() * 4) + 3; // 3〜6減算
        counterEl.textContent = String(current).padStart(6, '0');

        msgEl.innerHTML = `
      <b>【エラー：減算処理中】</b><br>
      アクセスが集中したため、さらに自動減算が実行されました。<br>
      現在値：<b>${String(current).padStart(6, '0')}</b><br>
      ※キリ番からは刻一刻と遠ざかっています。あきらめてBBSへお戻りください。
    `;
      }
    }
  </script>

</body>

</html>
