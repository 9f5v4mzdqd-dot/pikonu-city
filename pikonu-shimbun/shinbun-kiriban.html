<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>キリ番通過チェッカー - ピコぬ新聞社公式BBS</title>
  <style>
    body {
      background-color: #000022;
      color: #ffffff;
      font-family: "ＭＳ Ｐゴシック", "MS PGothic", sans-serif;
      font-size: 12px;
      line-height: 1.5;
      margin: 15px;
    }

    .kiriban-box {
      width: 480px;
      max-width: 100%;
      box-sizing: border-box;
      margin: 0 auto;
      background-color: #111133;
      border: 2px ridge #5555aa;
      padding: 15px;
      text-align: center;
    }

    /* AA用スタイル（最初は非表示） */
    .aa-text {
      font-family: "ＭＳ Ｐゴシック", "MS PGothic", "Mona", sans-serif;
      font-size: 12px;
      line-height: 1.2;
      white-space: pre;
      overflow-x: auto;
      display: none;
      /* 初期状態は隠す */
      text-align: left;
      margin: 15px auto 5px auto;
      color: #aaffaa;
    }

    .counter-display {
      background-color: #000000;
      color: #00ff00;
      font-family: "Courier New", monospace;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 3px;
      border: 2px inset #666666;
      padding: 8px 15px;
      display: inline-block;
      margin: 15px 0 10px 0;
    }

    .btn-check {
      background-color: #333366;
      color: #ffff00;
      border: 2px outset #666699;
      font-family: "ＭＳ Ｐゴシック", sans-serif;
      font-size: 12px;
      padding: 6px 14px;
      cursor: pointer;
      margin-top: 5px;
    }

    .btn-check:active {
      border-style: inset;
    }

    #result-msg {
      margin-top: 10px;
      padding: 10px;
      background-color: #220000;
      border: 1px solid #880000;
      color: #ffaaaa;
      font-size: 11px;
      text-align: left;
      display: none;
    }

    .notice-text {
      font-size: 10px;
      color: #8888aa;
      margin-top: 15px;
      text-align: left;
    }
  </style>
</head>

<body>

  <div class="kiriban-box">
    <div style="color: #00ffff; font-weight: bold; font-size: 13px;">
      ■ 掲示板アクセス記念・7777キリ番チェッカー
    </div>

    <div style="font-size: 11px; color: #cccccc; margin-top: 10px;">
      現在のカウント（キリ番「7777」まであと 1 アクセス！）
    </div>

    <!-- カウンター（最初から7776） -->
    <div class="counter-display" id="counter">007776</div>
    <br>

    <button class="btn-check" onclick="tryKiriban()">［ カウンターを更新してキリ番を踏む！ ］</button>

    <!-- ボタンを押すとヌッと出現するピコぬくんAA -->
    <pre class="aa-text" id="piko-aa"></pre>

    <!-- 結果メッセージ -->
    <div id="result-msg"></div>

    <div class="notice-text">
      【管理担当より】<br>
      ※当サイトのアクセスカウンターはサーバー負荷軽減のため、5分おきに自動減算処理を行っております。<br>
      ※キリ番報告のお問い合わせメールには返信いたしかねます。
    </div>
  </div>

  <script>
    let clicked = false;

    function tryKiriban() {
      const counterEl = document.getElementById('counter');
      const msgEl = document.getElementById('result-msg');
      const aaEl = document.getElementById('piko-aa');

      // AAエリアを表示させる
      aaEl.style.display = 'inline-block';

      if (!clicked) {
        // 1回目のクリック
        counterEl.textContent = '007771';
        counterEl.style.color = '#ff3333';

        aaEl.textContent =
          `       ▲
      (〇)
    /  _  \\
   ( ・ ・ )
   (   ヮ  )  ＜ 7777キリ番は存在しませんぬ(´ω｀)
  /│┌───┐│\\
 ( ││ Ｐ ││ )
  \\└┴───┴┘/
     |__|__|`;

        msgEl.innerHTML = `
      <b>【エラー：キリ番通過失敗】</b><br>
      申し訳ありません。あなたがボタンを押した直前（自動減算シークエンス）により、カウンターが <b>-5</b> 減算されました。<br><br>
      現在値：<b>007771</b><br>
      ※7777番は正常にスキップ（減算）されました。物理的に踏むことはできません。
    `;
        msgEl.style.display = 'block';
        clicked = true;
      } else {
        // 2回目以降のクリック
        let current = parseInt(counterEl.textContent, 10);
        current -= Math.floor(Math.random() * 4) + 3;
        counterEl.textContent = String(current).padStart(6, '0');

        aaEl.textContent =
          `       ▲
      (〇)
    /  _  \\
   ( ・ ヮ・)  ＜ 押せば押すほど遠ざかるぬ(´ω｀)
   (   ヮ  ) 
  /│┌───┐│\\
 ( ││ Ｐ ││ )
  \\└┴───┴┘/
     |__|__|`;

        msgEl.innerHTML = `
      <b>【エラー：さらに減算処理中】</b><br>
      アクセス集中により、追加の自動減算が実行されました。<br>
      現在値：<b>${String(current).padStart(6, '0')}</b><br>
      ※キリ番からは刻一刻と遠ざかっています。あきらめてBBSへお戻りください。
    `;
      }
    }
  </script>

</body>

</html>
