<title>宝くじと猫と、世界経済の終焉</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #0d1117;
    color: #58a6ff;
    font-family: 'Courier New', monospace;
    padding: 20px;
    margin: 0;
  }
  #game-box {
    border: 2px solid #30363d;
    padding: 25px;
    max-width: 720px;
    margin: 20px auto;
    background: #161b22;
    box-shadow: 0 0 25px rgba(88,166,255,0.12);
    position: relative;
  }
  h1 {
    color: #f0883e;
    text-align: center;
    font-size: 20px;
    letter-spacing: 2px;
    margin: 0 0 4px;
  }
  .subtitle {
    text-align: center;
    color: #8b949e;
    font-size: 11px;
    margin-bottom: 14px;
  }
  .ascii-divider {
    color: #30363d;
    text-align: center;
    font-size: 12px;
    white-space: pre;
    margin: 10px 0;
    user-select: none;
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .chapter-tag {
    color: #d29922;
    font-size: 12px;
    border: 1px dashed #d29922;
    display: inline-block;
    padding: 2px 10px;
  }
  #menu-toggle {
    background: #21262d;
    color: #a5d6ff;
    border: 1px solid #30363d;
    padding: 4px 10px;
    font-family: monospace;
    font-size: 12px;
    cursor: pointer;
    border-radius: 6px;
  }
  #menu-toggle:hover { border-color: #58a6ff; }
  #chapter-menu {
    display: none;
    border: 1px solid #30363d;
    background: #0d1117;
    padding: 12px;
    margin-bottom: 14px;
    border-radius: 6px;
  }
  #chapter-menu .menu-title {
    color: #f0883e;
    font-size: 12px;
    margin-bottom: 8px;
  }
  .menu-item {
    display: block;
    width: 100%;
    text-align: left;
    background: #161b22;
    color: #58a6ff;
    border: 1px solid #21262d;
    padding: 8px 10px;
    margin: 6px 0;
    font-family: monospace;
    font-size: 12.5px;
    border-radius: 5px;
    cursor: pointer;
  }
  .menu-item:hover { border-color: #f0883e; color: #f0883e; }
  .menu-item.locked {
    color: #484f58;
    cursor: not-allowed;
    border-style: dashed;
  }
  .menu-item.locked:hover { border-color: #21262d; color: #484f58; }
  .pixel-art {
    display: flex;
    justify-content: center;
    margin-bottom: 16px;
  }
  .pixel-art svg {
    max-width: 100%;
    height: auto;
    image-rendering: pixelated;
    border: 1px solid #30363d;
    border-radius: 4px;
    background: #0d1117;
  }
  #story {
    font-size: 15px;
    line-height: 1.8;
    color: #c9d1d9;
    min-height: 140px;
    margin-bottom: 18px;
    white-space: pre-wrap;
  }
  .voice {
    display: block;
    margin: 10px 0;
    padding: 8px 12px;
    border-left: 3px solid #58a6ff;
    background: rgba(88,166,255,0.06);
    font-size: 13px;
    color: #a5d6ff;
  }
  .voice.piko-suke {
    border-left-color: #8b949e;
    color: #8b949e;
    background: rgba(139,148,158,0.06);
  }
  .voice.neko {
    border-left-color: #f0883e;
    color: #ffd7a8;
    background: rgba(240,136,62,0.06);
  }
  .choice-btn {
    background: #21262d;
    color: #58a6ff;
    border: 1px solid #30363d;
    padding: 12px;
    display: block;
    width: 100%;
    margin: 8px 0;
    cursor: pointer;
    text-align: left;
    font-family: monospace;
    font-size: 14px;
    border-radius: 6px;
    transition: 0.15s;
  }
  .choice-btn:hover {
    background: #30363d;
    color: #f0883e;
    border-color: #f0883e;
  }
  #free-input-row {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  #free-feedback {
    font-size: 12px;
    margin-top: 8px;
    min-height: 16px;
    color: #7ee787;
  }
  #free-feedback.miss { color: #f0883e; }
  #free-input {
    flex: 1;
    background: #0d1117;
    border: 1px solid #30363d;
    color: #c9d1d9;
    padding: 10px;
    font-family: monospace;
    font-size: 14px;
    border-radius: 6px;
  }
  #free-input:focus { outline: 1px solid #f0883e; }
  #free-submit {
    background: #f0883e;
    color: #161b22;
    border: none;
    padding: 0 16px;
    font-family: monospace;
    font-weight: bold;
    cursor: pointer;
    border-radius: 6px;
  }
  #free-submit:hover { background: #ffab5e; }
  #status {
    font-size: 12px;
    color: #8b949e;
    border-top: 1px solid #30363d;
    padding-top: 12px;
    margin-top: 20px;
    line-height: 1.8;
    white-space: pre-wrap;
  }
</style>
</head>

/* ============ 効果音（Web Audio APIで生成、外部ファイル不要） ============ */
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    audioCtx = new Ctx();
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function beep(freq, start, duration, volume) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = "square";
  osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
  gain.gain.setValueAtTime(volume, ctx.currentTime + start);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(ctx.currentTime + start);
  osc.stop(ctx.currentTime + start + duration);
}
function playSelectSound() {
  // ファミコンの決定音っぽい「ピコッ」（2音上昇）
  beep(660, 0, 0.045, 0.12);
  beep(990, 0.045, 0.06, 0.12);
}
function playMissSound() {
  // 反応なし時の「ブブッ」（低め2音）
  beep(220, 0, 0.07, 0.10);
  beep(160, 0.07, 0.09, 0.10);
}
function playMenuSound() {
  beep(520, 0, 0.05, 0.08);
}

    html += `<div class="pixel-art">${SVG_SHIP}</div>`;
  } else if (node.img === "mug") {
    html += `<div class="pixel-art">${SVG_MUG}</div>`;
  } else if (node.img === "monitor") {
    html += `<div class="pixel-art">${SVG_MONITOR}</div>`;
  }
  html += node.text.trim();
  if (node.voices) {
    node.voices.forEach(v => {
      html += `\n\n<span class="voice ${v.cls}">【${v.who}】${v.text}</span>`;
    });
  }
  document.getElementById("story").innerHTML = html;

  const choicesDiv = document.getElementById("choices");
  choicesDiv.innerHTML = "";
  if (node.choices && node.choices.length) {
    node.choices.forEach(c => {
      const btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.textContent = c.label;
      btn.onclick = () => { playSelectSound(); render(c.next); };
      choicesDiv.appendChild(btn);
    });
  } else {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.textContent = "🔁 最初からやり直す";
    btn.onclick = () => { playSelectSound(); visited.clear(); visited.add("start"); render("start"); };
    choicesDiv.appendChild(btn);
  }

  const s = node.status;
  document.getElementById("status").textContent =
`財政状況　： ${s.money}
相棒・仲間： ${s.ally}
市の状態　： ${s.stage}`;

  document.getElementById("free-input").value = "";
  if (menuOpen) renderMenu();
}

function toggleMenu() {
  playMenuSound();
  menuOpen = !menuOpen;
  document.getElementById("chapter-menu").style.display = menuOpen ? "block" : "none";
  if (menuOpen) renderMenu();
}

function renderMenu() {
  const menu = document.getElementById("chapter-menu");
  let html = `<div class="menu-title">📖 章選択（到達済みの章のみジャンプ可）</div>`;
  chapterMap.forEach(c => {
    const unlocked = visited.has(c.id);
    if (unlocked) {
      html += `<button class="menu-item" onclick="playMenuSound(); render('${c.id}'); toggleMenu();">${c.label}</button>`;
    } else {
      html += `<div class="menu-item locked">🔒 ${c.label}（未到達）</div>`;
    }
  });
  menu.innerHTML = html;
}

function handleFreeInput() {
  const raw = document.getElementById("free-input").value.trim();
  const feedback = document.getElementById("free-feedback");
  if (!raw) return;

  const route = freeRoutes.find(r => r.keys.some(k => raw.includes(k)));
  if (route) {
    playSelectSound();
    render(route.next);
    feedback.className = "";
    feedback.textContent = `→ 反応あり：「${route.label}」ルートへジャンプしました`;
    const box = document.getElementById("game-box");
    if (box && typeof box.scrollIntoView === "function") {
      box.scrollIntoView({behavior:"smooth", block:"start"});
    }
    return;
  }

  playMissSound();
  const story = document.getElementById("story");
  story.innerHTML += `\n\n<span class="voice piko-suke">【ピコ助】入力「${escapeHtml(raw)}」を解析中……解析、失敗しました。市長、もう少し分かりやすくお願いします（棒読み）。</span>`;
  feedback.className = "miss";
  feedback.textContent = `→ 反応なし：この言葉に対応する行動は用意されていません（上のストーリー欄にピコ助のコメントが追加されました）`;
  document.getElementById("free-input").value = "";
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

document.getElementById("free-input").addEventListener("keydown", e => {
  if (e.key === "Enter") handleFreeInput();
});

render("start");
</script>
</body>
</html>
