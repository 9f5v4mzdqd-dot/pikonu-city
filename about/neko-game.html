    /* ============ 効果音（Web Audio APIで生成、外部ファイル不要） ============ */
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        audioCtx = new Ctx();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }
    function beep(freq, start, duration, volume) {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
      gain.gain.setValueAtTime(volume, ctx.currentTime + start);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + duration);
    }
    function playSelectSound() {
      // ファミコンの決定音っぽい「ピコッ」（2音上昇）
      beep(660, 0, 0.045, 0.12);

    }
    function playMissSound() {

      beep(220, 0, 0.07, 0.10);
      beep(160, 0.07, 0.09, 0.10);
    }

    }

      html += node.text.trim();

        });
      }
      document.getElementById("story").innerHTML = html;

      const choicesDiv = document.getElementById("choices");
      choicesDiv.innerHTML = "";

        node.choices.forEach(c => {
          const btn = document.createElement("button");
          btn.className = "choice-btn";
          btn.textContent = c.label;
          btn.onclick = () => {playSelectSound(); render(c.next);};
          choicesDiv.appendChild(btn);
        });
      } else {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.textContent = "🔁 最初からやり直す";
        btn.onclick = () => {playSelectSound(); visited.clear(); visited.add("start"); render("start");};

      }

      document.getElementById("status").textContent =

相棒・仲間： ${s.ally}
市の状態　： ${s.stage}`;

      document.getElementById("free-input").value = "";
      if (menuOpen) renderMenu();
    }

    function toggleMenu() {
      playMenuSound();
      menuOpen = !menuOpen;
      document.getElementById("chapter-menu").style.display = menuOpen ? "block" : "none";
      if (menuOpen) renderMenu();
    }

    function renderMenu() {
      const menu = document.getElementById("chapter-menu");
      let html = `<div class="menu-title">📖 章選択（到達済みの章のみジャンプ可）</div>`;
      chapterMap.forEach(c => {
        const unlocked = visited.has(c.id);
        if (unlocked) {
          html += `<button class="menu-item" onclick="playMenuSound(); render('${c.id}'); toggleMenu();">${c.label}</button>`;
        } else {
          html += `<div class="menu-item locked">🔒 ${c.label}（未到達）</div>`;
        }
      });
      menu.innerHTML = html;
    }

    function handleFreeInput() {
      const raw = document.getElementById("free-input").value.trim();
      const feedback = document.getElementById("free-feedback");
      if (!raw) return;

      const route = freeRoutes.find(r => r.keys.some(k => raw.includes(k)));
      if (route) {
        playSelectSound();
        render(route.next);
        feedback.className = "";
        feedback.textContent = `→ 反応あり：「${route.label}」ルートへジャンプしました`;
        const box = document.getElementById("game-box");
        if (box && typeof box.scrollIntoView === "function") {
          box.scrollIntoView({behavior: "smooth", block: "start"});
        }
        return;
      }

      playMissSound();
      const story = document.getElementById("story");
      story.innerHTML += `\n\n<span class="voice piko-suke">【ピコ助】入力「${escapeHtml(raw)}」を解析中……解析、失敗しました。市長、もう少し分かりやすくお願いします（棒読み）。</span>`;
      feedback.className = "miss";
      feedback.textContent = `→ 反応なし：この言葉に対応する行動は用意されていません（上のストーリー欄にピコ助のコメントが追加されました）`;
      document.getElementById("free-input").value = "";
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }

    document.getElementById("free-input").addEventListener("keydown", e => {
      if (e.key === "Enter") handleFreeInput();
    });

    render("start");
